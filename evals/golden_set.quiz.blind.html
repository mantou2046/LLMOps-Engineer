4.0 + WSL2 集成 —— kind 只需要 Docker，", "- 一个 release 的 values 漂移不会自动同步到另一个 —— 没有\"继承\"机制。", "不用再引入 hypervisor。", "背景：D15 要把「可部署单元」注册进 Model Registry 并管理版本切换。MLflow 有两种指针机制：stage（Staging / Production 生命周期）与 alias（可任意指向某版本的标签）；stage 自 MLflow 2.9 起已 deprecated。", "改 YAML、删 Pod 验证持久化 —— kind delete cluster 干净利落，一天里重建多次不心疼。", "3. 贴近 CI：K8s 官方自己就用 kind 跑测试，同一套命令以后能直接搬进 CI。", "kubectl port-forward。D4 要外部访问时再评估 Ingress（kind 需配 extraPortMappings）。"], "values": ["- NodePort **不能直接从宿主机访问**（节点 IP 在 Docker 网络里）→ 本地验证统一走", "- `--dry-run=client -o yaml | kubectl apply -f -` 是**幂等**的：重复执行不会报", "2. **起停快、可反复推倒**：实测 `Ready after 12s`。D3/D4/D5 要反复 load 镜像、", "**代价（已知）**", "- 需要 WSL 集成开启；⚠️ `wsl --shutdown` 会**连带停掉 Docker 的 WSL 后端**。", "**复核条件**：需要多节点拓扑、或想一键装 Ingress/Dashboard 等 addon 时，重新评估 minikube。", "**背景**：D3 要一个本地 K8s 集群，候选是 `kind` / `minikube` / `k3s`。", "**决策**：用 **kind v0.33.0**，集群名 `llmops`。", "1. **复用已有环境**：D2 已装 Docker Desktop 4.94.0 + WSL2 集成 —— kind 只需要 Docker，", "- 一个 release 的 values 漂移不会自动同步到另一个 —— 没有\"继承\"机制。", "不用再引入 hypervisor。", "**背景**：D15 要把「可部署单元」注册进 Model Registry 并管理版本切换。MLflow 有两种指针机制：stage（Staging / Production 生命周期）与 alias（可任意指向某版本的标签）；stage 自 MLflow 2.9 起已 deprecated。", "改 YAML、删 Pod 验证持久化 —— `kind delete cluster` 干净利落，一天里重建多次不心疼。", "3. **贴近 CI**：K8s 官方自己就用 kind 跑测试，同一套命令以后能直接搬进 CI。", "`kubectl port-forward`。D4 要外部访问时再评估 Ingress（kind 需配 `extraPortMappings`）。"], "original": "\n**背景**：D3 要一个本地 K8s 集群，候选是 `kind` / `minikube` / `k3s`。\n\n**决策**：用 **kind v0.33.0**，集群名 `llmops`。\n\n**理由**\n\n1. **复用已有环境**：D2 已装 Docker Desktop 4.94.0 + WSL2 集成 —— kind 只需要 Docker，  \n   不用再引入 hypervisor。\n2. **起停快、可反复推倒**：实测 `Ready after 12s`。D3/D4/D5 要反复 load 镜像、  \n   改 YAML、删 Pod 验证持久化 —— `kind delete cluster` 干净利落，一天里重建多次不心疼。\n3. **贴近 CI**：K8s 官方自己就用 kind 跑测试，同一套命令以后能直接搬进 CI。\n\n**代价（已知）**\n\n- NodePort **不能直接从宿主机访问**（节点 IP 在 Docker 网络里）→ 本地验证统一走  \n  `kubectl port-forward`。D4 要外部访问时再评估 Ingress（kind 需配 `extraPortMappings`）。\n- 需要 WSL 集成开启；⚠️ `wsl --shutdown` 会**连带停掉 Docker 的 WSL 后端**。\n\n**复核条件**：需要多节点拓扑、或想一键装 Ingress/Dashboard 等 addon 时，重新评估 minikube。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g004", "type": "single_hop", "question": "kind 载入多架构镜像时，用哪个命令代替 kind load？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-009 · kind 载入 multi-arch 镜像用 `ctr ... import --platform`，不用 `kind load`（2026-10-09 · W1 D4）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["副作用 / 代价：比 kind load 啰嗦（3 条命令 vs 1 条），所以", "ctr 默认按 --all-platforms 解，遇到解不开的外平台层就报 digest not found。", "- ⚠️ docker cp 传 POSIX 路径（/tmp/pgv.tar）会报", "—— Git Bash 的路径转换所致，必须传真实 Windows 路径。", "复核条件：建集群时清掉 HTTPS_PROXY 等代理变量、且镜像只推 amd64", "背景：kind load docker-image pgvector/pgvector:pg16 报", "ctr: content digest sha256:a45475a5bc78...: not found；", "- 并发让失败定位变难（要翻结果表的 error 列）→ 每行带 error / attempts / retries，别只留成功行。", "换 kind load image-archive 同样报错。而本仓库自建的 llmops-api:0.1.0", "用同一条命令却能正常载入 → 是镜像的问题，不是 kind 坏了。", "根因（两条，缺一不可）", "1. 代理泄漏：节点从建集群那一刻继承了宿主环境变量", "HTTPS_PROXY=http://127.0.0.1:13566。而节点内部的 127.0.0.1", "实证：D13 三组 RMSE——验证集基线 7.759；PU_DO 组合特征 9.827 → 7.759（降一个量级）；Lasso 11.167 更差。", "指向节点自己、不是宿主 → 一切回源动作必然", "proxyconnect tcp: dial tcp 127.0.0.1:13566: connect: connection refused。", "2. 外平台层：docker save 出的 tar 有 23 个 blob / 16 个 manifest 层，", "多出的 7 个是其它架构的层（pgvector 是 multi-arch 镜像）。", "决策：改用「docker save → docker cp → 节点内 ctr import --platform」。", "- --platform linux/amd64 只解当前架构的层，绕开外平台层。", "- 这条路径完全不依赖节点联网，顺带规避了代理泄漏问题。", "GetFileAttributesEx e:\\tmp: The system cannot find the file specified", "- 缓存命中看响应 id，不看耗时：耗时受负载影响（见过 2026ms 的命中），而命中返回的是缓存原文，id / created / usage 全原样复用。", "只对 multi-arch 镜像用这条兜底路径；自建的单架构镜像继续用 kind load。", "单架构（或改用 --platform 构建）时，kind load 会重新变得够用。"], "values": ["**副作用 / 代价**：比 `kind load` 啰嗦（3 条命令 vs 1 条），所以", "`ctr` 默认按 `--all-platforms` 解，遇到解不开的外平台层就报 digest not found。", "- ⚠️ `docker cp` 传 POSIX 路径（`/tmp/pgv.tar`）会报", "—— Git Bash 的路径转换所致，**必须传真实 Windows 路径**。", "**复核条件**：建集群时清掉 `HTTPS_PROXY` 等代理变量、且镜像只推 amd64", "**背景**：`kind load docker-image pgvector/pgvector:pg16` 报", "`ctr: content digest sha256:a45475a5bc78...: not found`；", "- 并发让**失败定位变难**（要翻结果表的 `error` 列）→ 每行带 `error` / `attempts` / `retries`，别只留成功行。", "换 `kind load image-archive` 同样报错。而本仓库自建的 `llmops-api:0.1.0`", "用同一条命令却能正常载入 → **是镜像的问题，不是 kind 坏了**。", "**根因（两条，缺一不可）**", "1. **代理泄漏**：节点从**建集群那一刻**继承了宿主环境变量", "`HTTPS_PROXY=http://127.0.0.1:13566`。而节点**内部**的 `127.0.0.1`", "**实证**：D13 三组 RMSE——验证集基线 **7.759**；`PU_DO` 组合特征 9.827 → 7.759（降一个量级）；Lasso 11.167 更差。", "指向节点自己、不是宿主 → 一切回源动作必然", "`proxyconnect tcp: dial tcp 127.0.0.1:13566: connect: connection refused`。", "2. **外平台层**：`docker save` 出的 tar 有 **23 个 blob / 16 个 manifest 层**，", "多出的 7 个是**其它架构的层**（pgvector 是 multi-arch 镜像）。", "**决策**：改用「`docker save` → `docker cp` → 节点内 `ctr import --platform`」。", "- `--platform linux/amd64` **只解当前架构的层**，绕开外平台层。", "- 这条路径**完全不依赖节点联网**，顺带规避了代理泄漏问题。", "`GetFileAttributesEx e:\\tmp: The system cannot find the file specified`", "- **缓存命中看响应 `id`，不看耗时**：耗时受负载影响（见过 2026ms 的命中），而命中返回的是缓存原文，`id` / `created` / `usage` 全原样复用。", "**只对 multi-arch 镜像用这条兜底路径**；自建的单架构镜像继续用 `kind load`。", "单架构（或改用 `--platform` 构建）时，`kind load` 会重新变得够用。"], "original": "\n**背景**：`kind load docker-image pgvector/pgvector:pg16` 报  \n`ctr: content digest sha256:a45475a5bc78...: not found`；  \n换 `kind load image-archive` 同样报错。而本仓库自建的 `llmops-api:0.1.0`  \n用同一条命令却能正常载入 → **是镜像的问题，不是 kind 坏了**。\n\n**根因（两条，缺一不可）**\n\n1. **代理泄漏**：节点从**建集群那一刻**继承了宿主环境变量  \n   `HTTPS_PROXY=http://127.0.0.1:13566`。而节点**内部**的 `127.0.0.1`  \n   指向节点自己、不是宿主 → 一切回源动作必然  \n   `proxyconnect tcp: dial tcp 127.0.0.1:13566: connect: connection refused`。\n2. **外平台层**：`docker save` 出的 tar 有 **23 个 blob / 16 个 manifest 层**，  \n   多出的 7 个是**其它架构的层**（pgvector 是 multi-arch 镜像）。  \n   `ctr` 默认按 `--all-platforms` 解，遇到解不开的外平台层就报 digest not found。\n\n**决策**：改用「`docker save` → `docker cp` → 节点内 `ctr import --platform`」。\n\n```bash\ndocker save pgvector/pgvector:pg16 -o pgv.tar\nexport MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'   # ⚠️ Git Bash 会改写路径\ndocker cp \"E:\\Projects\\LLMOps-Engineer\\pgv.tar\" llmops-control-plane:/pgv.tar\ndocker exec llmops-control-plane ctr -n k8s.io images import \\\n    --platform linux/amd64 /pgv.tar\n```\n\n**理由**\n\n- `--platform linux/amd64` **只解当前架构的层**，绕开外平台层。\n- 这条路径**完全不依赖节点联网**，顺带规避了代理泄漏问题。\n- ⚠️ `docker cp` 传 POSIX 路径（`/tmp/pgv.tar`）会报  \n  `GetFileAttributesEx e:\\tmp: The system cannot find the file specified`  \n  —— Git Bash 的路径转换所致，**必须传真实 Windows 路径**。\n\n**副作用 / 代价**：比 `kind load` 啰嗦（3 条命令 vs 1 条），所以  \n**只对 multi-arch 镜像用这条兜底路径**；自建的单架构镜像继续用 `kind load`。\n\n**复核条件**：建集群时清掉 `HTTPS_PROXY` 等代理变量、且镜像只推 amd64  \n单架构（或改用 `--platform` 构建）时，`kind load` 会重新变得够用。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g005", "type": "multi_hop", "question": "readiness 和 liveness 探针失败各会造成什么后果，怎么从现象上区分？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-012 · 三种探针的分工：readiness 比 liveness 灵敏一个数量级（2026-10-09 · W1 D5）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["代价高 → 必须容忍瞬时抖动。", "决策：三组参数刻意不等，按「失败代价」排序取不同灵敏度。", "理由（核心权衡）", "- readiness 要灵敏（6s）：误判的代价只是「短暂少一个副本接流量」，代价低 → 可以激进。", "- 自造数据不是妥协，反而更好用：能主动设计难例（条款冲突、跨文档引用、应该拒答的问题），而真实数据往往「刚好能用」却覆盖不到边界 —— 难例质量直接决定评估体系的说服力", "- liveness 要保守（30s）：误判的代价是重启容器（冷启动 + 可能进 CrashLoop 恶性循环），", "按实际用到的资源逐个放开，不要预留「以后可能用得上」的权限 ——", "比 liveness 的 30s 更宽才能有效。⚠️ 若 startup 窗口 ≤ liveness 窗口，startup 形同虚设", "—— 所以 verify_d5.sh 里专门有一条断言检查这个不等式。", "有 startupProbe 兜住启动期后，liveness 从容器一启动就可以探（因为 startup 成功前它根本不执行）。", "1. Docker 29 + kind load 全家全灭（kind issue #3795/#4066）：kind load docker-image / image-archive / kind_load 资源底层全走节点内 ctr images import --all-platforms，撞 Docker 29 containerd image store 的导出 bug——docker save 导出的多平台 OCI index 引用未导出的 blob（amd64 宿主上 arm64 manifest 缺 blob）。绕行：老节点 ctr export --platform linux/amd64 → 宿主中转 → 新节点 ctr import --platform linux/amd64（固化成 scripts/load_pgvector_to_iaac.sh）。不用官方建议「关 containerd image store」——现有镜像全在那个 store 里。", "复核条件：应用启动变快（< 5s）后可考虑去掉 startupProbe；接入真实依赖后", "背景：D5 第 1 步要给 Deployment 加 liveness / readiness / startup 三种探针。", "探针参数写多少，是最容易随手拍、也最容易埋雷的地方。", "摘流量是可逆、廉价的操作。", "- startup 要最宽容（60s）：它的作用就是「在启动期替 liveness 挡住一切」，", "另一个决策：liveness 不写 initialDelaySeconds", "写 initialDelaySeconds 只会拖慢「发现真死锁」的速度。官方文档也明确：", "\"Liveness probes do not wait for readiness probes to succeed. If you want to wait before executing a liveness probe, you can either define initialDelaySeconds or use a startup probe.\"", "关键区分：liveness 打 /health（不查外部依赖），readiness 打 /ready（W2 改查数据库）", "liveness 若查数据库：数据库抖动 → liveness 失败 → 重启容器 → 但重启解决不了数据库问题，", "反而把所有副本轮流重启，把「外部依赖故障」放大成「服务全面不可用」。", "外部依赖的检查属于 readiness（此时摘流量是对的 —— 确实处理不了请求）。", "readiness 的 failureThreshold 可能要调大（避免依赖抖动导致频繁摘流量）。"], "values": ["代价高 → 必须容忍瞬时抖动。", "**决策**：三组参数**刻意不等**，按「失败代价」排序取不同灵敏度。", "**理由（核心权衡）**", "- **readiness 要灵敏（6s）**：误判的代价只是「短暂少一个副本接流量」，代价低 → 可以激进。", "- **自造数据不是妥协，反而更好用**：能**主动设计难例**（条款冲突、跨文档引用、应该拒答的问题），而真实数据往往「刚好能用」却覆盖不到边界 —— **难例质量直接决定评估体系的说服力**", "- **liveness 要保守（30s）**：误判的代价是**重启容器**（冷启动 + 可能进 CrashLoop 恶性循环），", "**按实际用到的资源逐个放开**，不要预留「以后可能用得上」的权限 ——", "比 liveness 的 30s 更宽才能有效。⚠️ **若 startup 窗口 ≤ liveness 窗口，startup 形同虚设**", "—— 所以 `verify_d5.sh` 里专门有一条断言检查这个不等式。", "有 startupProbe 兜住启动期后，liveness 从容器一启动就可以探（因为 startup 成功前它根本不执行）。", "1. **Docker 29 + kind load 全家全灭**（kind issue #3795/#4066）：`kind load docker-image` / `image-archive` / `kind_load` 资源底层全走节点内 `ctr images import --all-platforms`，撞 Docker 29 containerd image store 的导出 bug——`docker save` 导出的多平台 OCI index 引用未导出的 blob（amd64 宿主上 arm64 manifest 缺 blob）。绕行：老节点 `ctr export --platform linux/amd64` → 宿主中转 → 新节点 `ctr import --platform linux/amd64`（固化成 `scripts/load_pgvector_to_iaac.sh`）。不用官方建议「关 containerd image store」——现有镜像全在那个 store 里。", "**复核条件**：应用启动变快（< 5s）后可考虑去掉 startupProbe；接入真实依赖后", "**背景**：D5 第 1 步要给 Deployment 加 liveness / readiness / startup 三种探针。", "探针参数写多少，是最容易随手拍、也最容易埋雷的地方。", "摘流量是**可逆、廉价**的操作。", "- **startup 要最宽容（60s）**：它的作用就是「在启动期替 liveness 挡住一切」，", "**另一个决策：liveness 不写 `initialDelaySeconds`**", "写 `initialDelaySeconds` 只会拖慢「发现真死锁」的速度。官方文档也明确：", "> \"Liveness probes do not wait for readiness probes to succeed. If you want to wait before executing a liveness probe, you can either define `initialDelaySeconds` or use a startup probe.\"", "**关键区分：liveness 打 `/health`（不查外部依赖），readiness 打 `/ready`（W2 改查数据库）**", "liveness 若查数据库：数据库抖动 → liveness 失败 → 重启容器 → **但重启解决不了数据库问题**，", "反而把所有副本轮流重启，把「外部依赖故障」放大成「服务全面不可用」。", "外部依赖的检查属于 readiness（此时摘流量是对的 —— 确实处理不了请求）。", "readiness 的 `failureThreshold` 可能要调大（避免依赖抖动导致频繁摘流量）。"], "original": "\n**背景**：D5 第 1 步要给 Deployment 加 liveness / readiness / startup 三种探针。  \n探针参数写多少，是最容易随手拍、也最容易埋雷的地方。\n\n**决策**：三组参数**刻意不等**，按「失败代价」排序取不同灵敏度。\n\n| 探针             | 路径        | period | failureThreshold | 容忍窗口    | 失败后果             |\n| -------------- | --------- | ------ | ---------------- | ------- | ---------------- |\n| startupProbe   | `/health` | 2s     | 30               | **60s** | 杀容器（启动期）         |\n| livenessProbe  | `/health` | 10s    | 3                | **30s** | 重启容器             |\n| readinessProbe | `/ready`  | 3s     | 2                | **6s**  | 摘出 EndpointSlice |\n\n**理由（核心权衡）**\n\n- **readiness 要灵敏（6s）**：误判的代价只是「短暂少一个副本接流量」，代价低 → 可以激进。  \n  摘流量是**可逆、廉价**的操作。\n- **liveness 要保守（30s）**：误判的代价是**重启容器**（冷启动 + 可能进 CrashLoop 恶性循环），  \n  代价高 → 必须容忍瞬时抖动。\n- **startup 要最宽容（60s）**：它的作用就是「在启动期替 liveness 挡住一切」，  \n  比 liveness 的 30s 更宽才能有效。⚠️ **若 startup 窗口 ≤ liveness 窗口，startup 形同虚设**  \n  —— 所以 `verify_d5.sh` 里专门有一条断言检查这个不等式。\n\n**另一个决策：liveness 不写 `initialDelaySeconds`**\n\n有 startupProbe 兜住启动期后，liveness 从容器一启动就可以探（因为 startup 成功前它根本不执行）。  \n写 `initialDelaySeconds` 只会拖慢「发现真死锁」的速度。官方文档也明确：\n\n> \"Liveness probes do not wait for readiness probes to succeed. If you want to wait before executing a liveness probe, you can either define `initialDelaySeconds` or use a startup probe.\"\n\n**关键区分：liveness 打 `/health`（不查外部依赖），readiness 打 `/ready`（W2 改查数据库）**\n\nliveness 若查数据库：数据库抖动 → liveness 失败 → 重启容器 → **但重启解决不了数据库问题**，  \n反而把所有副本轮流重启，把「外部依赖故障」放大成「服务全面不可用」。  \n外部依赖的检查属于 readiness（此时摘流量是对的 —— 确实处理不了请求）。\n\n**复核条件**：应用启动变快（< 5s）后可考虑去掉 startupProbe；接入真实依赖后  \nreadiness 的 `failureThreshold` 可能要调大（避免依赖抖动导致频繁摘流量）。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g006", "type": "multi_hop", "question": "结合决策日志里的专属 ServiceAccount 与 K8s 概念笔记里的 RBAC 三层模型，说明应用拿到的权限边界由哪两样东西决定？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-016 · 生产工作负载一律用专属 ServiceAccount + 最小权限 Role（2026-10-13 · W2 D7）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["那为什么还要折腾？因为不给权限 ≠ 没有权限：K8s 会自动把 ServiceAccount token", "三条容易写错的坑（实测）", "（⚠️ 这里刻意不写成 键: 值 的形式 —— 仓库的脱敏门禁按「键=值」扫凭据，", "实测证据（W2 D7）", "所以「最小权限」的准确说法是收敛到内置基线，不是收敛到零。", "复核条件：若该应用将来真的需要调 API（如做成 operator、或要写 ConfigMap 做热更新），", "背景：DEC-007 要给应用配 ServiceAccount + Role。先问一句「它到底要调哪些 K8s API」——", "答案是一个都不用：llmops-api 是普通 HTTP 服务，不 list Pod、不写 ConfigMap。", "挂进每个 Pod 的 /var/run/secrets/kubernetes.io/serviceaccount/token。", "背景：实验层与请求层两个观测工具都能接，先划清各记哪一半。", "应用一旦被 RCE（依赖漏洞、命令注入、SSRF 打到元数据），攻击者拿到的就是这枚 token。", "1. 每个工作负载用自己的 ServiceAccount，不用 default —— 权限可按工作负载单独回收。", "2. 用 Role + RoleBinding（不是 ClusterRole），作用域锁死在本命名空间。", "3. 能不用 API 的，把 automountServiceAccountToken 显式关掉，连 token 都不挂。", "环境即代码的意义不是「我用过 Terraform」，是「我的环境可以从版本库里的一组文件，一键从无到有」。", "会把任何 SomeKey: someValue 的行都拦下来，包括这个正经的 K8s 字段。）", "4. 确实要读的，用 resourceNames 收窄到具体对象，而不是给整个资源类型。", "本 Chart 的 templates/rbac.yaml 按 2 + 4 实现（为了把机制演示完整）：", "只给「读自己那一个 ConfigMap」+「读本命名空间 Pod」，其余一概不给。", "kubectl auth can-i --as=system:serviceaccount:dev:llmops-dev-llmops-chart -n dev：", "容器内实证（用 Pod 自己挂载的 token 直接打 API Server，比 auth can-i 更有说服力）：", "1. resourceNames 与 list/watch 互斥。它只对 get/update/patch/delete 生效；", "规则里一旦加上 list 或 watch，resourceNames 会被静默忽略，", "规则退化成「能读本命名空间所有该类型资源」—— 看着更严，实际更松，且不报错。", "2. 「零 Role」≠「零权限」。auth can-i --list 显示，即使一条规则都不给，", "SA 仍自带一组集群级只读权限（/api/、/apis/、/healthz、/version 等），", "来自内置的 system:discovery / system:public-info-viewer。", "3. RoleBinding 的 subject 要绑 SA，不是绑命名空间。绑成 Group 或", "实跑抓到的三个环境级坑（比验收本身值钱）", "serviceaccounts 全量，等于给该命名空间所有工作负载都发了同一套权限。", "按实际用到的资源逐个放开，不要预留「以后可能用得上」的权限 ——", "预授权正是最小权限失效的头号原因。"], "values": ["那为什么还要折腾？因为**不给权限 ≠ 没有权限**：K8s 会自动把 ServiceAccount token", "**三条容易写错的坑（实测）**", "（⚠️ 这里刻意不写成 `键: 值` 的形式 —— 仓库的脱敏门禁按「键=值」扫凭据，", "**实测证据（W2 D7）**", "所以「最小权限」的准确说法是**收敛到内置基线**，不是收敛到零。", "**复核条件**：若该应用将来真的需要调 API（如做成 operator、或要写 ConfigMap 做热更新），", "**背景**：DEC-007 要给应用配 ServiceAccount + Role。先问一句「它到底要调哪些 K8s API」——", "答案是**一个都不用**：`llmops-api` 是普通 HTTP 服务，不 list Pod、不写 ConfigMap。", "挂进每个 Pod 的 `/var/run/secrets/kubernetes.io/serviceaccount/token`。", "**背景**：实验层与请求层两个观测工具都能接，先划清各记哪一半。", "应用一旦被 RCE（依赖漏洞、命令注入、SSRF 打到元数据），攻击者拿到的就是这枚 token。", "1. 每个工作负载用**自己的** ServiceAccount，不用 `default` —— 权限可按工作负载单独回收。", "2. 用 **Role + RoleBinding**（不是 ClusterRole），作用域锁死在本命名空间。", "3. 能不用 API 的，把 `automountServiceAccountToken` 显式关掉，**连 token 都不挂**。", "> 环境即代码的意义不是「我用过 Terraform」，是「我的环境可以从版本库里的一组文件，一键从无到有」。", "会把任何 `SomeKey: someValue` 的行都拦下来，包括这个正经的 K8s 字段。）", "4. 确实要读的，用 `resourceNames` 收窄到**具体对象**，而不是给整个资源类型。", "本 Chart 的 `templates/rbac.yaml` 按 2 + 4 实现（为了把机制演示完整）：", "只给「读自己那一个 ConfigMap」+「读本命名空间 Pod」，其余一概不给。", "`kubectl auth can-i --as=system:serviceaccount:dev:llmops-dev-llmops-chart -n dev`：", "**容器内实证**（用 Pod 自己挂载的 token 直接打 API Server，比 `auth can-i` 更有说服力）：", "1. **`resourceNames` 与 `list`/`watch` 互斥**。它只对 `get`/`update`/`patch`/`delete` 生效；", "规则里一旦加上 `list` 或 `watch`，`resourceNames` 会被**静默忽略**，", "规则退化成「能读本命名空间**所有**该类型资源」—— 看着更严，实际更松，且不报错。", "2. **「零 Role」≠「零权限」**。`auth can-i --list` 显示，即使一条规则都不给，", "SA 仍自带一组集群级只读权限（`/api/*`、`/apis/*`、`/healthz`、`/version` 等），", "来自内置的 `system:discovery` / `system:public-info-viewer`。", "3. **RoleBinding 的 subject 要绑 SA，不是绑命名空间**。绑成 `Group` 或", "**实跑抓到的三个环境级坑（比验收本身值钱）**", "`serviceaccounts` 全量，等于给该命名空间所有工作负载都发了同一套权限。", "**按实际用到的资源逐个放开**，不要预留「以后可能用得上」的权限 ——", "预授权正是最小权限失效的头号原因。"], "original": "\n**背景**：DEC-007 要给应用配 ServiceAccount + Role。先问一句「它到底要调哪些 K8s API」——  \n答案是**一个都不用**：`llmops-api` 是普通 HTTP 服务，不 list Pod、不写 ConfigMap。\n\n那为什么还要折腾？因为**不给权限 ≠ 没有权限**：K8s 会自动把 ServiceAccount token  \n挂进每个 Pod 的 `/var/run/secrets/kubernetes.io/serviceaccount/token`。  \n应用一旦被 RCE（依赖漏洞、命令注入、SSRF 打到元数据），攻击者拿到的就是这枚 token。\n\n**决策**\n\n1. 每个工作负载用**自己的** ServiceAccount，不用 `default` —— 权限可按工作负载单独回收。\n2. 用 **Role + RoleBinding**（不是 ClusterRole），作用域锁死在本命名空间。\n3. 能不用 API 的，把 `automountServiceAccountToken` 显式关掉，**连 token 都不挂**。  \n   （⚠️ 这里刻意不写成 `键: 值` 的形式 —— 仓库的脱敏门禁按「键=值」扫凭据，  \n   会把任何 `SomeKey: someValue` 的行都拦下来，包括这个正经的 K8s 字段。）\n4. 确实要读的，用 `resourceNames` 收窄到**具体对象**，而不是给整个资源类型。\n\n本 Chart 的 `templates/rbac.yaml` 按 2 + 4 实现（为了把机制演示完整）：  \n只给「读自己那一个 ConfigMap」+「读本命名空间 Pod」，其余一概不给。\n\n**实测证据（W2 D7）**\n\n`kubectl auth can-i --as=system:serviceaccount:dev:llmops-dev-llmops-chart -n dev`：\n\n| 动作                               | 结果    | 说明                   |\n| -------------------------------- | ----- | -------------------- |\n| 读**自己那一个** ConfigMap             | ✅ yes | 由 `resourceNames` 放行 |\n| 读**同命名空间另一个** ConfigMap          | ❌ no  | 同一条规则，仅因对象名不同即被拒     |\n| 列出全部 ConfigMap / Secret          | ❌ no  | 没给 `list`            |\n| 读 / 列出 Secret                    | ❌ no  | 完全没这条规则              |\n| 读 / 列出 Pod                       | ✅ yes | 显式给的最小读权限            |\n| 删除 Pod / exec 进 Pod              | ❌ no  |                      |\n| 读 Deployment                     | ❌ no  |                      |\n| **跨命名空间**读 ConfigMap / Pod（prod） | ❌ no  | Role 的命名空间边界         |\n\n**容器内实证**（用 Pod 自己挂载的 token 直接打 API Server，比 `auth can-i` 更有说服力）：\n\n| 请求                                                                     | 状态码     |\n| ---------------------------------------------------------------------- | ------- |\n| `GET /api/v1/namespaces/dev/configmaps/llmops-dev-llmops-chart-config` | **200** |\n| `GET /api/v1/namespaces/dev/configmaps/kube-root-ca.crt`               | **403** |\n| `GET /api/v1/namespaces/dev/configmaps`（list）                          | 403     |\n| `GET /api/v1/namespaces/dev/secrets`                                   | 403     |\n| `GET /api/v1/namespaces/dev/pods`                                      | 200     |\n| `GET /apis/apps/v1/namespaces/dev/deployments`                         | 403     |\n| `GET /api/v1/namespaces`                                               | 403     |\n\n**三条容易写错的坑（实测）**\n\n1. **`resourceNames` 与 `list`/`watch` 互斥**。它只对 `get`/`update`/`patch`/`delete` 生效；  \n   规则里一旦加上 `list` 或 `watch`，`resourceNames` 会被**静默忽略**，  \n   规则退化成「能读本命名空间**所有**该类型资源」—— 看着更严，实际更松，且不报错。\n2. **「零 Role」≠「零权限」**。`auth can-i --list` 显示，即使一条规则都不给，  \n   SA 仍自带一组集群级只读权限（`/api/*`、`/apis/*`、`/healthz`、`/version` 等），  \n   来自内置的 `system:discovery` / `system:public-info-viewer`。  \n   所以「最小权限」的准确说法是**收敛到内置基线**，不是收敛到零。\n3. **RoleBinding 的 subject 要绑 SA，不是绑命名空间**。绑成 `Group` 或  \n   `serviceaccounts` 全量，等于给该命名空间所有工作负载都发了同一套权限。\n\n**复核条件**：若该应用将来真的需要调 API（如做成 operator、或要写 ConfigMap 做热更新），  \n**按实际用到的资源逐个放开**，不要预留「以后可能用得上」的权限 ——  \n预授权正是最小权限失效的头号原因。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g007", "type": "single_hop", "question": "HPA 的 CPU 目标值为什么只有在 requests 贴近真实用量时才有意义？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-017 · HPA 的 CPU 目标值只有在 requests 贴近真实用量时才有意义（2026-10-13 · W2 D7）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["不是「节点 CPU 的百分比」。所以上 HPA 之前必须先校准 requests.cpu；", "顺带实测到的两条 HPA 行为（官方文档只说结论，这里是现场数据）", "实测证据（W2 D7 压测）", "即使扩到 5 副本，总 requests 也只有 250m，而实际需求约 500m+ ——", "- 扩容快、缩容慢的由来：scaleUp.stabilizationWindowSeconds 默认 0，", "scaleDown 默认 300。本次停压后 CPU 在 100 秒内就掉到 6%，", "演练完 kubectl delete，主应用全程不动。", "所以「CPU 已经很低」和「HPA 可以缩容」之间必然有 5 分钟左右的延迟。", "复核条件：拿到真实用量后把 requests.cpu 调到接近 P95（本应用约 100m），", "背景：DEC-007 给 dev / prod 都开了 HPA（dev 1–5 @50%，prod 2–6 @60%）。", "压测时副本数一路顶到 maxReplicas 就不再动了 —— 但 CPU 利用率明明远高于目标值，", "实测（2026-11-02，LiteLLM 1.106.4 / Prometheus v3.15.1 / Grafana 13.2.5；假上游首包 300ms、每段 40ms×5、usage 写死 100/50）", "按理应该继续扩才对。", "决策：HPA 的 targetCPUUtilizationPercentage 是「实际用量 ÷ requests」的百分比，", "requests 定得比真实用量低一个数量级时，HPA 会长期贴在 maxReplicas，等于没有扩缩能力。", "2. 同一 Chart + 两套 values + 两个 Namespace", "分母太小，利用率永远降不回 50%，HPA 只能一直加副本直到撞上限。", "但副本数死守 5 直到第 360 秒，随后 5 → 2 → 1 分两步落回。", "- 缩容取的是过去 300 秒内建议值的最大值（防抖动），", "再重跑一次压测确认副本数能停在中间档位而不是撞上限；", "DEC-011 做资源账本时一并把 limits 也校准一遍。"], "values": ["不是「节点 CPU 的百分比」**。所以上 HPA 之前必须先校准 `requests.cpu`；", "**顺带实测到的两条 HPA 行为**（官方文档只说结论，这里是现场数据）", "**实测证据（W2 D7 压测）**", "即使扩到 5 副本，**总 requests 也只有 250m**，而实际需求约 500m+ ——", "- **扩容快、缩容慢**的由来：`scaleUp.stabilizationWindowSeconds` 默认 **0**，", "`scaleDown` 默认 **300**。本次停压后 CPU 在 100 秒内就掉到 6%，", "演练完 `kubectl delete`，主应用全程不动。", "所以「CPU 已经很低」和「HPA 可以缩容」之间必然有 5 分钟左右的延迟。", "**复核条件**：拿到真实用量后把 `requests.cpu` 调到接近 P95（本应用约 100m），", "**背景**：DEC-007 给 dev / prod 都开了 HPA（dev 1–5 @50%，prod 2–6 @60%）。", "压测时副本数一路顶到 `maxReplicas` 就不再动了 —— 但 CPU 利用率明明远高于目标值，", "**实测**（2026-11-02，LiteLLM 1.106.4 / Prometheus v3.15.1 / Grafana 13.2.5；假上游首包 300ms、每段 40ms×5、usage 写死 100/50）", "按理应该继续扩才对。", "**决策**：**HPA 的 `targetCPUUtilizationPercentage` 是「实际用量 ÷ requests」的百分比，", "requests 定得比真实用量低一个数量级时，HPA 会长期贴在 `maxReplicas`，等于没有扩缩能力。", "2. **同一 Chart + 两套 values + 两个 Namespace**", "分母太小，利用率永远降不回 50%，HPA 只能一直加副本直到撞上限。", "但副本数**死守 5 直到第 360 秒**，随后 5 → 2 → 1 分两步落回。", "- 缩容取的是**过去 300 秒内建议值的最大值**（防抖动），", "再重跑一次压测确认副本数能停在中间档位而不是撞上限；", "DEC-011 做资源账本时一并把 limits 也校准一遍。"], "original": "\n**背景**：DEC-007 给 dev / prod 都开了 HPA（dev 1–5 @50%，prod 2–6 @60%）。  \n压测时副本数一路顶到 `maxReplicas` 就不再动了 —— 但 CPU 利用率明明远高于目标值，  \n按理应该继续扩才对。\n\n**决策**：**HPA 的 `targetCPUUtilizationPercentage` 是「实际用量 ÷ requests」的百分比，  \n不是「节点 CPU 的百分比」**。所以上 HPA 之前必须先校准 `requests.cpu`；  \nrequests 定得比真实用量低一个数量级时，HPA 会长期贴在 `maxReplicas`，等于没有扩缩能力。\n\n**实测证据（W2 D7 压测）**\n\n| 观测项                                  | 数值                                       |\n| ------------------------------------ | ---------------------------------------- |\n| `requests.cpu`（dev）                  | **50m**                                  |\n| 压测中每个 Pod 实际 CPU（`kubectl top pods`） | **90m – 135m**                           |\n| 单 Pod 利用率                            | 180% – 270%（= 实际 ÷ 50m）                  |\n| HPA 目标                               | 50%（= 绝对阈值 25m）                          |\n| 结果                                   | 2 → 4 → 5（贴 `maxReplicas`），CPU 仍停在 200%+ |\n\n即使扩到 5 副本，**总 requests 也只有 250m**，而实际需求约 500m+ ——  \n分母太小，利用率永远降不回 50%，HPA 只能一直加副本直到撞上限。\n\n**顺带实测到的两条 HPA 行为**（官方文档只说结论，这里是现场数据）\n\n- **扩容快、缩容慢**的由来：`scaleUp.stabilizationWindowSeconds` 默认 **0**，  \n  `scaleDown` 默认 **300**。本次停压后 CPU 在 100 秒内就掉到 6%，  \n  但副本数**死守 5 直到第 360 秒**，随后 5 → 2 → 1 分两步落回。\n- 缩容取的是**过去 300 秒内建议值的最大值**（防抖动），  \n  所以「CPU 已经很低」和「HPA 可以缩容」之间必然有 5 分钟左右的延迟。\n\n**复核条件**：拿到真实用量后把 `requests.cpu` 调到接近 P95（本应用约 100m），  \n再重跑一次压测确认副本数能停在中间档位而不是撞上限；  \nDEC-011 做资源账本时一并把 limits 也校准一遍。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g008", "type": "single_hop", "question": "上游重试窗口为什么只覆盖「首 token 之前」？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-018 · 上游重试用指数退避 + 抖动，且重试窗口只覆盖「首 token 之前」（2026-10-14 · W2 D8）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["- 为什么关 SDK 重试：openai SDK 默认自己会重试，若不关，「3 次重试」会变成", "实测证据（W2 D8 本地验收）", "但重试不是「失败就再来」：不设上限会放大雪崩，不区分错误类型会白烧额度，", "4. 只重试 retryable 错误：连接失败 / 读超时 / 408 / 409 / 429 / 5xx → 重试；", "- 为什么是指数退避而不是固定间隔：上游抖动通常是短暂拥塞。固定 1s 重试会在拥塞未缓解时", "- 为什么上限是 3 次而不是更多：这是「用户体验」与「成功率」的折中。", "- 为什么重试次数要写进响应头（X-Upstream-Retries）：排障时一眼就能区分", "「这次慢是因为重试了」还是「上游本来就慢」，不用翻日志。", "scaleDown 默认 300。本次停压后 CPU 在 100 秒内就掉到 6%，", "三条踩坑（备查）", "2. 重试要显式关掉 SDK 的那一层，否则两层叠加（见理由末条）。", "复核条件：接入真实上游并积累一段 429 / 5xx 的实际发生率后，重新校准", "背景：D8 要把 /chat 做成「可上集群的 API」。上游模型会抖 —— 502 / 连接重置 /", "读超时都可能，直接透传给用户就是把上游的抖动放大成我们的不可用。", "在流式场景下重试还会让用户看到答案从头重来。", "1. 重试只在「首 token 之前」。流式响应一旦开始吐字就不再重试 ——", "半截答案没法续，重发等于客户端看到答案从头发一遍，比断流更难排查。", "2. 指数退避 1s→2s→4s…，封顶 8s，每次再叠 0–0.5s 随机抖动（防多实例同时重试 = 惊群）。", "3. 共 3 次尝试（含首发）后放弃，耗尽转 502（不是 500 —— 语义是「我们没问题，上游有问题」，", "监控告警该分流）。", "400 / 401 / 403 / 404 → 不重试（请求或凭据有问题，重来一遍结果一样，只是白烧额度）。", "5. 关掉 SDK 自带的重试（max_retries=0）。", "再打一次、再打一次，等于给已经过载的上游加压；指数退避让重试间隔随失败次数拉开，", "给上游恢复留时间。抖动是为了避免「所有实例同一秒重试」形成新的尖峰。", "- compose 的 depends_on: condition: service_healthy 在 K8s 里没有直接等价物（要用 initContainer），迁移时需要改写", "3 次尝试在指数退避下最长约等 1+2 = 3s（不含抖动），用户还能接受；", "再多就要十几秒，用户早走了，而且失败概率的边际收益急剧下降。", "3×3 次，上游一次抖动能把客户端拖死十几秒。重试策略只能有一层，且要显式。", "1. 流式下「首 token 超时」≠「总超时」。首 token 超时是「建连后一直不来数据」，", "总超时是「整个响应拖太久」；混成一个值会把长回答误杀（首 token 正常但生成慢）。", "本实现里重试只对首 token 之前的故障生效，天然避开了这个歧义。", "3. 结构化输出（JSON mode）不可靠：模型仍可能吐出带 markdown 围栏的文本。", "本实现不假设一定能 parse —— 解析失败时保留原文 + 标 parse_failed=true，", "- 基础镜像锁死后，安全补丁需要手动 bump（这是「可重现」的必然代价）", "让调用方看到现场，而不是静默返回 null。", "LLM_MAX_ATTEMPTS 与退避上限；若发现长回答因「总超时」被误杀，则把", "「首 token 超时」与「总超时」拆成两个独立参数。"], "values": ["- **为什么关 SDK 重试**：openai SDK 默认自己会重试，若不关，「3 次重试」会变成", "**实测证据（W2 D8 本地验收）**", "但重试不是「失败就再来」：不设上限会放大雪崩，不区分错误类型会白烧额度，", "4. **只重试 `retryable` 错误**：连接失败 / 读超时 / 408 / 409 / 429 / 5xx → 重试；", "- **为什么是指数退避而不是固定间隔**：上游抖动通常是短暂拥塞。固定 1s 重试会在拥塞未缓解时", "- **为什么上限是 3 次而不是更多**：这是「用户体验」与「成功率」的折中。", "- **为什么重试次数要写进响应头**（`X-Upstream-Retries`）：排障时一眼就能区分", "「这次慢是因为重试了」还是「上游本来就慢」，不用翻日志。", "`scaleDown` 默认 **300**。本次停压后 CPU 在 100 秒内就掉到 6%，", "**三条踩坑（备查）**", "2. **重试要显式关掉 SDK 的那一层**，否则两层叠加（见理由末条）。", "**复核条件**：接入真实上游并积累一段 429 / 5xx 的实际发生率后，重新校准", "**背景**：D8 要把 `/chat` 做成「可上集群的 API」。上游模型会抖 —— 502 / 连接重置 /", "读超时都可能，直接透传给用户就是把上游的抖动放大成我们的不可用。", "在流式场景下重试还会让用户看到答案从头重来。", "1. **重试只在「首 token 之前」**。流式响应一旦开始吐字就不再重试 ——", "半截答案没法续，重发等于客户端看到答案从头发一遍，比断流更难排查。", "2. **指数退避 1s→2s→4s…，封顶 8s**，每次再叠 0–0.5s **随机抖动**（防多实例同时重试 = 惊群）。", "3. **共 3 次尝试（含首发）后放弃**，耗尽转 **502**（不是 500 —— 语义是「我们没问题，上游有问题」，", "监控告警该分流）。", "400 / 401 / 403 / 404 → 不重试（请求或凭据有问题，重来一遍结果一样，只是白烧额度）。", "5. **关掉 SDK 自带的重试**（`max_retries=0`）。", "再打一次、再打一次，等于给已经过载的上游加压；指数退避让重试间隔随失败次数拉开，", "给上游恢复留时间。抖动是为了避免「所有实例同一秒重试」形成新的尖峰。", "- compose 的 `depends_on: condition: service_healthy` 在 K8s 里没有直接等价物（要用 initContainer），迁移时需要改写", "3 次尝试在指数退避下最长约等 1+2 = 3s（不含抖动），用户还能接受；", "再多就要十几秒，用户早走了，而且失败概率的边际收益急剧下降。", "3×3 次，上游一次抖动能把客户端拖死十几秒。重试策略只能有一层，且要显式。", "1. **流式下「首 token 超时」≠「总超时」**。首 token 超时是「建连后一直不来数据」，", "总超时是「整个响应拖太久」；混成一个值会把长回答误杀（首 token 正常但生成慢）。", "本实现里重试只对首 token 之前的故障生效，天然避开了这个歧义。", "3. **结构化输出（JSON mode）不可靠**：模型仍可能吐出带 markdown 围栏的文本。", "本实现不假设一定能 parse —— 解析失败时保留原文 + 标 `parse_failed=true`，", "- 基础镜像锁死后，安全补丁需要手动 bump（这是「可重现」的必然代价）", "让调用方看到现场，而不是静默返回 null。", "`LLM_MAX_ATTEMPTS` 与退避上限；若发现长回答因「总超时」被误杀，则把", "「首 token 超时」与「总超时」拆成两个独立参数。"], "original": "\n**背景**：D8 要把 `/chat` 做成「可上集群的 API」。上游模型会抖 —— 502 / 连接重置 /  \n读超时都可能，直接透传给用户就是把上游的抖动放大成我们的不可用。  \n但重试不是「失败就再来」：不设上限会放大雪崩，不区分错误类型会白烧额度，  \n在流式场景下重试还会让用户看到答案从头重来。\n\n**决策**\n\n1. **重试只在「首 token 之前」**。流式响应一旦开始吐字就不再重试 ——  \n   半截答案没法续，重发等于客户端看到答案从头发一遍，比断流更难排查。\n2. **指数退避 1s→2s→4s…，封顶 8s**，每次再叠 0–0.5s **随机抖动**（防多实例同时重试 = 惊群）。\n3. **共 3 次尝试（含首发）后放弃**，耗尽转 **502**（不是 500 —— 语义是「我们没问题，上游有问题」，  \n   监控告警该分流）。\n4. **只重试 `retryable` 错误**：连接失败 / 读超时 / 408 / 409 / 429 / 5xx → 重试；  \n   400 / 401 / 403 / 404 → 不重试（请求或凭据有问题，重来一遍结果一样，只是白烧额度）。\n5. **关掉 SDK 自带的重试**（`max_retries=0`）。\n\n**理由**\n\n- **为什么是指数退避而不是固定间隔**：上游抖动通常是短暂拥塞。固定 1s 重试会在拥塞未缓解时  \n  再打一次、再打一次，等于给已经过载的上游加压；指数退避让重试间隔随失败次数拉开，  \n  给上游恢复留时间。抖动是为了避免「所有实例同一秒重试」形成新的尖峰。\n- **为什么上限是 3 次而不是更多**：这是「用户体验」与「成功率」的折中。  \n  3 次尝试在指数退避下最长约等 1+2 = 3s（不含抖动），用户还能接受；  \n  再多就要十几秒，用户早走了，而且失败概率的边际收益急剧下降。\n- **为什么重试次数要写进响应头**（`X-Upstream-Retries`）：排障时一眼就能区分  \n  「这次慢是因为重试了」还是「上游本来就慢」，不用翻日志。\n- **为什么关 SDK 重试**：openai SDK 默认自己会重试，若不关，「3 次重试」会变成  \n  3×3 次，上游一次抖动能把客户端拖死十几秒。重试策略只能有一层，且要显式。\n\n**实测证据（W2 D8 本地验收）**\n\n| 场景                              | 注入方式                                   | 结果                                              |\n| ------------------------------- | -------------------------------------- | ----------------------------------------------- |\n| 自动重试（2 次失败后成功）                  | `MOCK_FAIL_N_TIMES=2` + `LLM_MAX_ATTEMPTS=3` | 200，`attempts=3`、`retries=2`，响应头 `X-Upstream-Retries: 2` |\n| 重试耗尽                            | `MOCK_FAIL_N_TIMES=99` + `LLM_MAX_ATTEMPTS=2` | **502**，body 带 `{message, upstream, status}`      |\n| 指数退避生效                          | `LLM_BACKOFF_MIN=0.05` 观测两次退避间隔         | 日志 `0.1s 后重试` → `0.3s 后重试`（递增）                 |\n| 错误分类                            | 构造 401 / 400 / 500 / 429 / 连接失败 / 读超时  | 4xx 凭据/请求错 `retryable=False`，其余 `True`           |\n\n**三条踩坑（备查）**\n\n1. **流式下「首 token 超时」≠「总超时」**。首 token 超时是「建连后一直不来数据」，  \n   总超时是「整个响应拖太久」；混成一个值会把长回答误杀（首 token 正常但生成慢）。  \n   本实现里重试只对首 token 之前的故障生效，天然避开了这个歧义。\n2. **重试要显式关掉 SDK 的那一层**，否则两层叠加（见理由末条）。\n3. **结构化输出（JSON mode）不可靠**：模型仍可能吐出带 markdown 围栏的文本。  \n   本实现不假设一定能 parse —— 解析失败时保留原文 + 标 `parse_failed=true`，  \n   让调用方看到现场，而不是静默返回 null。\n\n**复核条件**：接入真实上游并积累一段 429 / 5xx 的实际发生率后，重新校准  \n`LLM_MAX_ATTEMPTS` 与退避上限；若发现长回答因「总超时」被误杀，则把  \n「首 token 超时」与「总超时」拆成两个独立参数。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g009", "type": "single_hop", "question": "实验记录的最小充分集要求记下哪些东西？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-023 · 实验记录的最小充分集（2026-10-20 · W3 D14）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["选择：快照五件套——代码版本（git_sha）+ 参数 + 指标 + 产物（模型/预处理器）+ 数据/评估集版本（eval_set_version），缺一件就只是日志。", "代价：每次实验多记两个字段；评估集换版要升版本号，管理成本略增。", "三处判据纠正（写进决策比写结论更有价值）：", "3. RoleBinding 的 subject 要绑 SA，不是绑命名空间。绑成 Group 或", "背景：run 记到什么程度，才能「三个月后不问人就重放」。", "实证：同代码同题两轮 p50 差 2.7 倍，只因上游负载不同 → eval_set_version 与 git_sha 都不可省。", "实证（2026-10-26 D1，本机 Prefect 3.9.0，run nebulous-pelican）："], "values": ["**选择**：快照五件套——**代码版本（git_sha）+ 参数 + 指标 + 产物（模型/预处理器）+ 数据/评估集版本（eval_set_version）**，缺一件就只是日志。", "**代价**：每次实验多记两个字段；评估集换版要升版本号，管理成本略增。", "**三处判据纠正（写进决策比写结论更有价值）**：", "3. **RoleBinding 的 subject 要绑 SA，不是绑命名空间**。绑成 `Group` 或", "**背景**：run 记到什么程度，才能「三个月后不问人就重放」。", "**实证**：同代码同题两轮 p50 差 2.7 倍，只因上游负载不同 → `eval_set_version` 与 `git_sha` 都不可省。", "**实证**（2026-10-26 D1，本机 Prefect 3.9.0，run `nebulous-pelican`）："], "original": "\n**背景**：run 记到什么程度，才能「三个月后不问人就重放」。\n\n**选择**：快照五件套——**代码版本（git_sha）+ 参数 + 指标 + 产物（模型/预处理器）+ 数据/评估集版本（eval_set_version）**，缺一件就只是日志。\n\n**实证**：同代码同题两轮 p50 差 2.7 倍，只因上游负载不同 → `eval_set_version` 与 `git_sha` 都不可省。\n\n**代价**：每次实验多记两个字段；评估集换版要升版本号，管理成本略增。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g010", "type": "single_hop", "question": "模型注册为什么用 alias 而不是 stage？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-025 · 模型注册用 alias 不用 stage（2026-10-21 · W3 D15）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["✅ 修法（持久生效，不是临时绕过）", "选择：用 alias（production / canary / champion），不建 stage。", "理由：alias 是裸指针——回滚 = 把指针拨回去，金丝雀 = 建第二个指针，全部零代码零部署；stage 把「一条单向流水线」写死在工具里，想表达回滚只能再建一套流水线或手工改 stage。", "代价：alias 没有状态机——工具不阻止把 production 拨到未 READY 的版本；多 alias 语义靠团队约定。对策：切 alias 走 review / CI，权限与职责管控到人，禁止手工拨。", "选择：整体注册成一个 Registry 版本（qa-combo）；prompt 原文不另存本地副本，从产出它的 run 的 artifact 里取、sha256 校验后才注册。", "背景：D15 要把「可部署单元」注册进 Model Registry 并管理版本切换。MLflow 有两种指针机制：stage（Staging / Production 生命周期）与 alias（可任意指向某版本的标签）；stage 自 MLflow 2.9 起已 deprecated。", "- 没有成本数字：x-litellm-response-cost- 全 0.0，因为 LiteLLM 不认识自定义模型名、无价目表；而上游 body 里明确有 cost: 2.24e-06。→ 在 model_list 补 input_cost_per_token / output_cost_per_token，否则成本是盲区（W7 补）。"], "values": ["**✅ 修法（持久生效，不是临时绕过）**", "**选择**：用 alias（`production` / `canary` / `champion`），不建 stage。", "**理由**：alias 是裸指针——回滚 = 把指针拨回去，金丝雀 = 建第二个指针，全部零代码零部署；stage 把「一条单向流水线」写死在工具里，想表达回滚只能再建一套流水线或手工改 stage。", "**代价**：alias 没有状态机——工具不阻止把 `production` 拨到未 READY 的版本；多 alias 语义靠团队约定。对策：切 alias 走 review / CI，权限与职责管控到人，禁止手工拨。", "**选择**：整体注册成一个 Registry 版本（`qa-combo`）；**prompt 原文不另存本地副本，从产出它的 run 的 artifact 里取、sha256 校验后才注册**。", "**背景**：D15 要把「可部署单元」注册进 Model Registry 并管理版本切换。MLflow 有两种指针机制：stage（Staging / Production 生命周期）与 alias（可任意指向某版本的标签）；stage 自 MLflow 2.9 起已 deprecated。", "- **没有成本数字**：`x-litellm-response-cost-*` 全 `0.0`，因为 LiteLLM 不认识自定义模型名、无价目表；而上游 body 里明确有 `cost: 2.24e-06`。→ 在 `model_list` 补 `input_cost_per_token` / `output_cost_per_token`，否则成本是盲区（W7 补）。"], "original": "\n**背景**：D15 要把「可部署单元」注册进 Model Registry 并管理版本切换。MLflow 有两种指针机制：stage（Staging / Production 生命周期）与 alias（可任意指向某版本的标签）；stage 自 MLflow 2.9 起已 deprecated。\n\n**选择**：用 alias（`production` / `canary` / `champion`），不建 stage。\n\n**理由**：alias 是裸指针——回滚 = 把指针拨回去，金丝雀 = 建第二个指针，全部零代码零部署；stage 把「一条单向流水线」写死在工具里，想表达回滚只能再建一套流水线或手工改 stage。\n\n**实证**：\n\n| 场景 | 证据 |\n| --- | --- |\n| 课程侧 | `taxi-duration`：`champion` 拨 v1→v2→v1，`load_model(\"models:/taxi-duration@champion\")` 全程一行代码；预测 [15.43, 6.49, 15.75, 21.68, 11.02] ↔ [15.33, 6.50, 15.20, 21.47, 10.79] 跟着变、再拨回 |\n| 作品集侧 | `qa-combo`：`production`→v1（prompt v0）/ `canary`→v2（prompt v1）；`combos.py` 同一行 `load_combo`，alias 一拨，system_prompt 从「只输出 JSON」变成「资金与财务问答」 |\n\n**代价**：alias 没有状态机——工具不阻止把 `production` 拨到未 READY 的版本；多 alias 语义靠团队约定。对策：切 alias 走 review / CI，权限与职责管控到人，禁止手工拨。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g011", "type": "multi_hop", "question": "把「模型版本与 prompt 版本必须一起管」和「prompt 以 git 为真源、registry 只做发布指针」两条决策合起来看，版本管理的真源在哪？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-027 · prompt 以 git 为真源，registry 只做发布指针（2026-10-21 · W3 D16）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["选择：prompt 的内容以 git 为唯一真源（prompts/<name>/v<N>.yaml），发布指向放 registry（Langfuse label / MLflow alias）；两边用 sha256(模板)[:8] 对账，CI 里不一致就红。一句话：git 管「对不对」，registry 管「现在用哪个」。", "面试口径：prompt 是代码不是配置——它改的是行为，所以要 PR/diff/评估/回滚；但它需要不发版就切，所以指针放 registry。追问「怎么保证 registry 里就是评审过的那版」→ hash 对账；「registry 挂了怎么办」→ 回落本地但必须说得出凭什么（local_pick）。", "代价与对策：双写 → 注册脚本只读 yaml + CI 对账 + labels.yaml 把指针镜像回 git；指针人人可拨 → 走 review/CI（同 DEC-025）；回落「猜最新版」会静默给错版本 → labels.yaml 还原指向、取不到才 latest 并在 local_pick 写明。", "背景：prompt 改一个字就是改行为，既要能评审/回滚（像代码），又要能不发版就切（像配置）。两条要求看似冲突。", "翻车一条 helm rollback <rev> 回退，且回滚本身也记为一个新 revision（可追溯）。", "反模式：只存数据库（无 diff/blame，删版本即事故）；只放 git（换版要发版）；prompt 在代码库再复制一份（两个真相源）；只写 trace metadata 不挂 prompt 对象（UI 的 Prompt Name 列空、按版本联动失效）。", "- [x] CI 怎么分层、push registry 怎么落地、本地绿为何不代表构建绿（W5 D5）→ 见 DEC-037", "这是 DEC-012「readiness 比 liveness 灵敏」的实战兑现。"], "values": ["**选择**：prompt 的**内容**以 git 为唯一真源（`prompts/<name>/v<N>.yaml`），**发布指向**放 registry（Langfuse label / MLflow alias）；两边用 `sha256(模板)[:8]` 对账，CI 里不一致就红。一句话：**git 管「对不对」，registry 管「现在用哪个」。**", "**面试口径**：prompt 是代码不是配置——它改的是行为，所以要 PR/diff/评估/回滚；但它需要不发版就切，所以指针放 registry。追问「怎么保证 registry 里就是评审过的那版」→ hash 对账；「registry 挂了怎么办」→ 回落本地但必须说得出凭什么（`local_pick`）。", "**代价与对策**：双写 → 注册脚本只读 yaml + CI 对账 + `labels.yaml` 把指针镜像回 git；指针人人可拨 → 走 review/CI（同 DEC-025）；回落「猜最新版」会静默给错版本 → `labels.yaml` 还原指向、取不到才 latest 并在 `local_pick` 写明。", "**背景**：prompt 改一个字就是改行为，既要能评审/回滚（像代码），又要能不发版就切（像配置）。两条要求看似冲突。", "翻车一条 `helm rollback <rev>` 回退，且回滚本身也记为一个新 revision（可追溯）。", "**反模式**：只存数据库（无 diff/blame，删版本即事故）；只放 git（换版要发版）；prompt 在代码库再复制一份（两个真相源）；只写 trace metadata 不挂 prompt 对象（UI 的 `Prompt Name` 列空、按版本联动失效）。", "- [x] CI 怎么分层、push registry 怎么落地、本地绿为何不代表构建绿（W5 D5）→ 见 DEC-037", "这是 DEC-012「readiness 比 liveness 灵敏」的实战兑现。"], "original": "\n**背景**：prompt 改一个字就是改行为，既要能评审/回滚（像代码），又要能不发版就切（像配置）。两条要求看似冲突。\n\n**选择**：prompt 的**内容**以 git 为唯一真源（`prompts/<name>/v<N>.yaml`），**发布指向**放 registry（Langfuse label / MLflow alias）；两边用 `sha256(模板)[:8]` 对账，CI 里不一致就红。一句话：**git 管「对不对」，registry 管「现在用哪个」。**\n\n**实证**：\n\n| 环节 | 证据 |\n| --- | --- |\n| 内容身份精确到字节 | v1 `d7b79571`；写成 `template: \\|` 多一个尾换行立刻变 `c8e16337`。v2 `009c95a5` → `c334b344` |\n| 注册闭环 | v1→`production`（`d7b79571`）、v2→`canary`（`009c95a5`）；`load_prompt` 的 `source` 由 `local` 翻成 `langfuse` |\n| 指针一步可挪 | 给 v2 加 `production` → v1 **自动变 `[]`**（labels 跨版本唯一）；`new_labels=[]` 是空操作，删 label 只能走 UI |\n| 删了不心疼 | 误删 version #2 → `canary` 404；一条命令从 yaml 重建，hash 不变；**重建后版本号还是 v2**（编号复用 → 身份只能靠 hash） |\n| 换版延迟 | 不重启可换版，但生效 = TTL(60s) + 1 个请求（stale-while-revalidate）；要立即生效用 `PROMPT_CACHE_TTL=0` |\n| 血缘对齐 | 两个 run 的 `model` / `max_tokens` / `eval_set` / `git_sha` 四项一致，唯一变量是 prompt 版本；`format_ok_rate` 双 1.0、`refusal_rate` 0.0 → 0.2 |\n\n**代价与对策**：双写 → 注册脚本只读 yaml + CI 对账 + `labels.yaml` 把指针镜像回 git；指针人人可拨 → 走 review/CI（同 DEC-025）；回落「猜最新版」会静默给错版本 → `labels.yaml` 还原指向、取不到才 latest 并在 `local_pick` 写明。\n\n**反模式**：只存数据库（无 diff/blame，删版本即事故）；只放 git（换版要发版）；prompt 在代码库再复制一份（两个真相源）；只写 trace metadata 不挂 prompt 对象（UI 的 `Prompt Name` 列空、按版本联动失效）。\n\n**面试口径**：prompt 是代码不是配置——它改的是行为，所以要 PR/diff/评估/回滚；但它需要不发版就切，所以指针放 registry。追问「怎么保证 registry 里就是评审过的那版」→ hash 对账；「registry 挂了怎么办」→ 回落本地但必须说得出凭什么（`local_pick`）。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g012", "type": "single_hop", "question": "分流为什么用规则而不用 LLM，重试又为什么只留网关一层？", "must_refuse": false, "source": "evals/corpus/decisions.md", "hint": "## DEC-033 · 分流用规则不用 LLM，重试只留网关一层（2026-10-28 · W4 D6）", "criteria": "", "group": "evals/corpus/decisions.md", "options": ["判据（每个取值为什么是这个数）：", "- ⚠️ docker cp 传 POSIX 路径（/tmp/pgv.tar）会报", "三处判据纠正（写进决策比写结论更有价值）：", "背景：按 MLOps Zoomcamp 的微软五级成熟度模型（L0 全手动 → L4 监控触发自动重训）给作品集定位。", "- 命中缓存 ≠ 一定快：实测过命中仍 2159ms（命中之前先付了一次失败尝试）。判据顺序固定为 cache-key / 响应 id / execution_id 优先，耗时只作参考。", "面试口径：分流是业务判断，只能在应用侧判——网关知道「primary 对应谁」，不知道「这问题难不难」。判档我用规则，6 微秒一次、同输入永远同结论、可回放；用模型判路由等于为了省钱先花钱，还多一层不可复现的失败点。重试我只留一层（网关），因为两层都配会让次数相乘、故障放大。接网关那天还顺手修了个真故障：别名指着一个上游已下架的模型，改一行 yaml 就换掉，应用代码一行没动——这就是网关存在的理由。", "1. 分流在应用侧用规则判（app/routing.py），不用 LLM 判路由。判据五类：structured +3、长度 ≥120 字 +2 / ≥40 字 +1、多轮 +1、强信号词 +3、弱信号词 +1（封顶 2）、引用材料 +2、简单词 −1（且只在没有复杂词时生效）。合计 ≥3 → primary，否则 cheap。", "背景：D6 要把作品集接进网关，并让「简单问题走便宜模型、复杂问题走前沿模型」。两条边界必须当场定死：谁来判档（网关还是应用、规则还是模型）、重试配几层（应用 + 网关各配一套会怎样）。", "4. 应用侧业务代码零改动接入网关：只换会话环境变量（use_gateway.ps1），/chat 只多了一个 model=auto 的默认值和三个回显位（响应头 X-Route- / body routing / 日志 route=）。", "代价与对策：", "2. 重试与降级只留一层，那一层是网关：应用侧 LLM_MAX_ATTEMPTS=1 + LLM_FALLBACK_ENABLED=false。", "3. 应用连网关一律写 127.0.0.1，不写 localhost（scripts/use_gateway.ps1 强制替换）。", "5. 别名背后用哪个模型不是永久契约：当天换了三次目标（deepseek-v4-flash-0731 上游 no_key → gemini-3.5-flash-lite → 又被 429 → gemini-flash-lite；deepseek-v4-flash → qwen3.5-397b），应用代码始终零改动。模型选型随上游可用性调整，不需要走应用发版。", "实证（2026-10-28 本机；LiteLLM 1.106.4 / 4001；应用 8000；上游 31415）", "- 「首发落到备用部署」是错的：我先这么解释「隔几分钟再问又变慢」，被 attempted-fallbacks: 0 打回来。真因是 localhost 的 IPv6 回落——看起来像缓存失效，实际是重新握手。教训：先列「怎么证伪」，再开口。", "- 上游 429 会伪装成任何事：两个别名都 fallback、total_tokens 从 66 跳到 140 那一串、每条 2s 起、缓存全 miss。第一步永远先看 model-group 是不是 backup。", "- 规则有边界：24/24 只说明「规则与自己的标注一致」，不代表泛化。→ 脚本里留 3 条故意判错的样本；真检验要等 W6 的 golden set。", "- 过判可忍、漏判不可忍：过判只多花钱，漏判直接让用户拿到差答案。→ 阈值宁低勿高。", "- 别名背后是死是活，网关不主动告警：cheap 指着一个 no_key 的模型跑了不知道多久。→ W7 补「别名健康检查」（定时打每个别名，落 model-group 与耗时）。", "- minAvailable 与副本数相等时，drain 会永久卡住 —— 这是「保护强度」与「可运维性」的直接取舍。", "反模式：用 LLM 判路由（为了省一次调用先花一次调用）；应用与网关各配一套重试；用耗时判断缓存是否命中；用 localhost 连本机服务；把「第 2 轮命中率 5/6」当成缓存健康度（它测的是上游脸色）。"], "values": ["**判据（每个取值为什么是这个数）**：", "- ⚠️ `docker cp` 传 POSIX 路径（`/tmp/pgv.tar`）会报", "**三处判据纠正（写进决策比写结论更有价值）**：", "**背景**：按 MLOps Zoomcamp 的微软五级成熟度模型（L0 全手动 → L4 监控触发自动重训）给作品集定位。", "- **命中缓存 ≠ 一定快**：实测过命中仍 2159ms（命中之前先付了一次失败尝试）。判据顺序固定为 `cache-key` / 响应 `id` / `execution_id` 优先，耗时只作参考。", "**面试口径**：分流是业务判断，只能在应用侧判——网关知道「`primary` 对应谁」，不知道「这问题难不难」。判档我用规则，6 微秒一次、同输入永远同结论、可回放；用模型判路由等于为了省钱先花钱，还多一层不可复现的失败点。重试我只留一层（网关），因为两层都配会让次数相乘、故障放大。接网关那天还顺手修了个真故障：别名指着一个上游已下架的模型，改一行 yaml 就换掉，应用代码一行没动——**这就是网关存在的理由**。", "1. **分流在应用侧用规则判**（`app/routing.py`），**不用 LLM 判路由**。判据五类：`structured` +3、长度 ≥120 字 +2 / ≥40 字 +1、多轮 +1、强信号词 +3、弱信号词 +1（封顶 2）、引用材料 +2、简单词 −1（**且只在没有复杂词时生效**）。合计 ≥3 → `primary`，否则 `cheap`。", "**背景**：D6 要把作品集接进网关，并让「简单问题走便宜模型、复杂问题走前沿模型」。两条边界必须当场定死：**谁来判档**（网关还是应用、规则还是模型）、**重试配几层**（应用 + 网关各配一套会怎样）。", "4. 应用侧业务代码**零改动**接入网关：只换会话环境变量（`use_gateway.ps1`），`/chat` 只多了一个 `model=auto` 的默认值和三个回显位（响应头 `X-Route-*` / body `routing` / 日志 `route=`）。", "**代价与对策**：", "2. **重试与降级只留一层，那一层是网关**：应用侧 `LLM_MAX_ATTEMPTS=1` + `LLM_FALLBACK_ENABLED=false`。", "3. **应用连网关一律写 `127.0.0.1`，不写 `localhost`**（`scripts/use_gateway.ps1` 强制替换）。", "5. **别名背后用哪个模型不是永久契约**：当天换了三次目标（`deepseek-v4-flash-0731` 上游 `no_key` → `gemini-3.5-flash-lite` → 又被 429 → `gemini-flash-lite`；`deepseek-v4-flash` → `qwen3.5-397b`），**应用代码始终零改动**。模型选型随上游可用性调整，不需要走应用发版。", "**实证**（2026-10-28 本机；LiteLLM 1.106.4 / 4001；应用 8000；上游 31415）", "- **「首发落到备用部署」是错的**：我先这么解释「隔几分钟再问又变慢」，被 `attempted-fallbacks: 0` 打回来。真因是 `localhost` 的 IPv6 回落——**看起来像缓存失效，实际是重新握手**。教训：先列「怎么证伪」，再开口。", "- **上游 429 会伪装成任何事**：两个别名都 fallback、`total_tokens` 从 66 跳到 140 那一串、每条 2s 起、缓存全 miss。**第一步永远先看 `model-group` 是不是 `backup`。**", "- **规则有边界**：24/24 只说明「规则与自己的标注一致」，不代表泛化。→ 脚本里留 3 条故意判错的样本；真检验要等 W6 的 golden set。", "- **过判可忍、漏判不可忍**：过判只多花钱，漏判直接让用户拿到差答案。→ 阈值宁低勿高。", "- **别名背后是死是活，网关不主动告警**：`cheap` 指着一个 `no_key` 的模型跑了不知道多久。→ W7 补「别名健康检查」（定时打每个别名，落 `model-group` 与耗时）。", "- `minAvailable` 与副本数相等时，drain 会**永久卡住** —— 这是「保护强度」与「可运维性」的直接取舍。", "**反模式**：用 LLM 判路由（为了省一次调用先花一次调用）；应用与网关各配一套重试；用耗时判断缓存是否命中；用 `localhost` 连本机服务；把「第 2 轮命中率 5/6」当成缓存健康度（它测的是上游脸色）。"], "original": "\n**背景**：D6 要把作品集接进网关，并让「简单问题走便宜模型、复杂问题走前沿模型」。两条边界必须当场定死：**谁来判档**（网关还是应用、规则还是模型）、**重试配几层**（应用 + 网关各配一套会怎样）。\n\n**选择**：\n1. **分流在应用侧用规则判**（`app/routing.py`），**不用 LLM 判路由**。判据五类：`structured` +3、长度 ≥120 字 +2 / ≥40 字 +1、多轮 +1、强信号词 +3、弱信号词 +1（封顶 2）、引用材料 +2、简单词 −1（**且只在没有复杂词时生效**）。合计 ≥3 → `primary`，否则 `cheap`。\n2. **重试与降级只留一层，那一层是网关**：应用侧 `LLM_MAX_ATTEMPTS=1` + `LLM_FALLBACK_ENABLED=false`。\n3. **应用连网关一律写 `127.0.0.1`，不写 `localhost`**（`scripts/use_gateway.ps1` 强制替换）。\n4. 应用侧业务代码**零改动**接入网关：只换会话环境变量（`use_gateway.ps1`），`/chat` 只多了一个 `model=auto` 的默认值和三个回显位（响应头 `X-Route-*` / body `routing` / 日志 `route=`）。\n5. **别名背后用哪个模型不是永久契约**：当天换了三次目标（`deepseek-v4-flash-0731` 上游 `no_key` → `gemini-3.5-flash-lite` → 又被 429 → `gemini-flash-lite`；`deepseek-v4-flash` → `qwen3.5-397b`），**应用代码始终零改动**。模型选型随上游可用性调整，不需要走应用发版。\n\n**实证**（2026-10-28 本机；LiteLLM 1.106.4 / 4001；应用 8000；上游 31415）\n\n| 实验 | 做法 | 结果 |\n| --- | --- | --- |\n| 判档成本 | `decide()` 连跑 20000 次取均值 | **4.8–6.0 µs/次**（两次实测）；对比 LLM 判路由 0.5–2s，差五个数量级 |\n| 离线路由命中率 | 24 条题面（12 简单 / 12 复杂）人工标注后离线跑 | `cheap` **12/24 = 50%**、`primary` **12/24 = 50%**，与标注**不符 0 条** |\n| 边界样本（故意留） | 3 条已知会判错的题 | 1 条**过判**（「计算」把定义题拉成 primary）+ 2 条**漏判**（多轮追问、要求完整枚举） |\n| 在线端到端 | `--rounds 3` × 6 条 = 18 请求 | 分流 **18/18 全对**；第 2、3 轮缓存 **6/6 命中**（16–32ms） |\n| 别名指向死模型 | `cheap` → `deepseek-v4-flash-0731`（上游 `available:false / no_key`） | 每条 cheap 先失败再 fallback：`attempted-fallbacks: 1`、`model-group: backup`、2.1–3.5s；改一行 yaml 换 gemini 后 `model-group: cheap`、0 fallback、1.17–1.5s，**应用代码零改动** |\n| 连接主机名 | 同一套 0s/90s 间隔，只换主机名 | `localhost` **2.094s** vs `127.0.0.1` **0.042s**（Windows 上 localhost 先解析 `::1`，网关只听 IPv4，每次新建连接多等约 2s） |\n\n**判据（每个取值为什么是这个数）**：\n\n| 项 | 取值 | 理由 |\n| --- | --- | --- |\n| 判档阈值 | `3` | 强信号词一条 +3 即达标；弱信号词要两条才够，避免「问步骤」被当成推理题 |\n| 强信号词权重 | `+3`（命中多个不叠加） | 出现「区别/对比/分析/为什么」就基本是推理题，叠加只会让长题更贵 |\n| 简单词减分 | `−1`，**且仅在无强/弱信号词时生效** | 反例：`…是什么关系？请对比两者的记账时点` 同时命中「是什么」和「对比」，无条件减分会判反 |\n| 重试层数 | **1（网关）** | 两层都配 = 次数相乘（应用 3 × 网关 retry+fallback 2 = 上游被敲 6 次），故障被放大且日志看不出谁在重试 |\n| 连接主机名 | `127.0.0.1` | `localhost` 在 Windows 上走 IPv6 回落，每次新建连接多 2s（实测差 50 倍） |\n\n**三处判据纠正（写进决策比写结论更有价值）**：\n- **「首发落到备用部署」是错的**：我先这么解释「隔几分钟再问又变慢」，被 `attempted-fallbacks: 0` 打回来。真因是 `localhost` 的 IPv6 回落——**看起来像缓存失效，实际是重新握手**。教训：先列「怎么证伪」，再开口。\n- **命中缓存 ≠ 一定快**：实测过命中仍 2159ms（命中之前先付了一次失败尝试）。判据顺序固定为 `cache-key` / 响应 `id` / `execution_id` 优先，耗时只作参考。\n- **上游 429 会伪装成任何事**：两个别名都 fallback、`total_tokens` 从 66 跳到 140 那一串、每条 2s 起、缓存全 miss。**第一步永远先看 `model-group` 是不是 `backup`。**\n\n**代价与对策**：\n- **规则有边界**：24/24 只说明「规则与自己的标注一致」，不代表泛化。→ 脚本里留 3 条故意判错的样本；真检验要等 W6 的 golden set。\n- **过判可忍、漏判不可忍**：过判只多花钱，漏判直接让用户拿到差答案。→ 阈值宁低勿高。\n- **别名背后是死是活，网关不主动告警**：`cheap` 指着一个 `no_key` 的模型跑了不知道多久。→ W7 补「别名健康检查」（定时打每个别名，落 `model-group` 与耗时）。\n\n**反模式**：用 LLM 判路由（为了省一次调用先花一次调用）；应用与网关各配一套重试；用耗时判断缓存是否命中；用 `localhost` 连本机服务；把「第 2 轮命中率 5/6」当成缓存健康度（它测的是上游脸色）。\n\n**面试口径**：分流是业务判断，只能在应用侧判——网关知道「`primary` 对应谁」，不知道「这问题难不难」。判档我用规则，6 微秒一次、同输入永远同结论、可回放；用模型判路由等于为了省钱先花钱，还多一层不可复现的失败点。重试我只留一层（网关），因为两层都配会让次数相乘、故障放大。接网关那天还顺手修了个真故障：别名指着一个上游已下架的模型，改一行 yaml 就换掉，应用代码一行没动——**这就是网关存在的理由**。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g013", "type": "single_hop", "question": "StorageClass 的 volumeBindingMode 设成什么，才能等 Pod 调度完再绑定卷？", "must_refuse": false, "source": "evals/corpus/k8s-concepts.md", "hint": "## 1. StorageClass 的 `volumeBindingMode`", "criteria": "", "group": "evals/corpus/k8s-concepts.md", "options": ["- 默认值是 Immediate，所以本地存储的 StorageClass 必须显式写 volumeBindingMode: WaitForFirstConsumer。", "—— 默认 SC 的 BINDMODE 就是 WaitForFirstConsumer，这就是为什么在 kind 上从没踩到上面那个坑（换成云上 Immediate 的 SC，同一份 YAML 就可能挂）。", "一句话判据", "一句话定义", "它决定「PVC 什么时候变成已绑定的 PV」：Immediate（未设置时的默认值）在 PVC 一创建就绑定并动态制备；WaitForFirstConsumer 则推迟到第一个使用该 PVC 的 Pod 被创建时，好让调度器把 Pod 的拓扑约束（资源需求 / nodeSelector / 亲和反亲和 / 污点容忍）算进去。", "⚠️ 反例（以为是这样、其实不是）", "以为「Immediate 是默认值，说明它更快更好，本地盘也该用它」。实际相反：本地盘、云盘这类只在部分节点可达的存储，用 Immediate 会在「还不知道 Pod 会调度到哪」的时候就随便挑一个节点把 PV 建好 —— Pod 后来被调度到别的节点，就永远 Pending（事件里是 node(s) had volume node affinity conflict）。", "两个衍生坑", "本项目落点 + 本地实测（2026-10-16）", "以为「kind 用的 kindnetd 不支持 NetworkPolicy，所以本地测不了」。实测是支持的（kindnet v20260820）：开着 netpol 时从 default 命名空间的 Pod 访问 dev 的 Service → 超时；关掉后同一测试 → 立即 200。对比明确，策略真的在拦流量。", "infra/k8s/postgres.yaml 的 volumeClaimTemplates 没写 storageClassName，走的是 kind 自带的默认 SC。现场查：", "绑定 PV 需要知道「卷在哪」；调度 Pod 又需要知道「卷在哪」才能挑节点 —— 这是个鸡生蛋问题。Immediate 单方面先绑，等于替调度器做了它做不了的决定；WaitForFirstConsumer 把决定权交回调度器，顺序才对。", "—— 最后那步是关键：副本数 = A 记录条数，客户端拿到的是「所有后端」，均衡得自己来。（演示资源已删除。）", "- 用了 WaitForFirstConsumer 就别在 Pod 里写 nodeName —— 那会绕过调度器，PVC 直接卡 pending。要指定节点用 nodeSelector: kubernetes.io/hostname。", "现场三种解析对比（在 default/llmops-api Pod 里用 Python getaddrinfo 查）：", "kubectl get sc -o custom-columns=NAME:.metadata.name,BINDMODE:.volumeBindingMode —— 本地/云盘 SC 的 BINDMODE 一栏应该是 WaitForFirstConsumer。"], "values": ["- **默认值是 `Immediate`**，所以本地存储的 StorageClass 必须**显式**写 `volumeBindingMode: WaitForFirstConsumer`。", "—— 默认 SC 的 BINDMODE 就是 **`WaitForFirstConsumer`**，这就是为什么在 kind 上从没踩到上面那个坑（换成云上 Immediate 的 SC，同一份 YAML 就可能挂）。", "**一句话判据**", "**一句话定义**", "它决定「PVC 什么时候变成已绑定的 PV」：`Immediate`（**未设置时的默认值**）在 **PVC 一创建**就绑定并动态制备；`WaitForFirstConsumer` 则**推迟到第一个使用该 PVC 的 Pod 被创建**时，好让调度器把 Pod 的拓扑约束（资源需求 / nodeSelector / 亲和反亲和 / 污点容忍）算进去。", "**⚠️ 反例（以为是这样、其实不是）**", "以为「`Immediate` 是默认值，说明它更快更好，本地盘也该用它」。实际相反：本地盘、云盘这类**只在部分节点可达**的存储，用 `Immediate` 会在「还不知道 Pod 会调度到哪」的时候就随便挑一个节点把 PV 建好 —— Pod 后来被调度到别的节点，就**永远 Pending**（事件里是 `node(s) had volume node affinity conflict`）。", "**两个衍生坑**", "**本项目落点 + 本地实测（2026-10-16）**", "以为「kind 用的 kindnetd 不支持 NetworkPolicy，所以本地测不了」。**实测是支持的**（kindnet v20260820）：开着 netpol 时从 `default` 命名空间的 Pod 访问 dev 的 Service → **超时**；关掉后同一测试 → 立即 200。对比明确，策略真的在拦流量。", "`infra/k8s/postgres.yaml` 的 `volumeClaimTemplates` 没写 `storageClassName`，走的是 kind 自带的默认 SC。现场查：", "绑定 PV 需要知道「卷在哪」；调度 Pod 又需要知道「卷在哪」才能挑节点 —— 这是个**鸡生蛋问题**。`Immediate` 单方面先绑，等于替调度器做了它做不了的决定；`WaitForFirstConsumer` 把决定权交回调度器，顺序才对。", "—— 最后那步是关键：**副本数 = A 记录条数**，客户端拿到的是「所有后端」，均衡得自己来。（演示资源已删除。）", "- 用了 `WaitForFirstConsumer` 就**别在 Pod 里写 `nodeName`** —— 那会绕过调度器，PVC 直接卡 `pending`。要指定节点用 `nodeSelector: kubernetes.io/hostname`。", "现场三种解析对比（在 `default/llmops-api` Pod 里用 Python `getaddrinfo` 查）：", "`kubectl get sc -o custom-columns=NAME:.metadata.name,BINDMODE:.volumeBindingMode` —— 本地/云盘 SC 的 BINDMODE 一栏应该是 `WaitForFirstConsumer`。"], "original": "\n**一句话定义**  \n它决定「PVC 什么时候变成已绑定的 PV」：`Immediate`（**未设置时的默认值**）在 **PVC 一创建**就绑定并动态制备；`WaitForFirstConsumer` 则**推迟到第一个使用该 PVC 的 Pod 被创建**时，好让调度器把 Pod 的拓扑约束（资源需求 / nodeSelector / 亲和反亲和 / 污点容忍）算进去。\n\n**⚠️ 反例（以为是这样、其实不是）**  \n以为「`Immediate` 是默认值，说明它更快更好，本地盘也该用它」。实际相反：本地盘、云盘这类**只在部分节点可达**的存储，用 `Immediate` 会在「还不知道 Pod 会调度到哪」的时候就随便挑一个节点把 PV 建好 —— Pod 后来被调度到别的节点，就**永远 Pending**（事件里是 `node(s) had volume node affinity conflict`）。\n\n**为什么**  \n绑定 PV 需要知道「卷在哪」；调度 Pod 又需要知道「卷在哪」才能挑节点 —— 这是个**鸡生蛋问题**。`Immediate` 单方面先绑，等于替调度器做了它做不了的决定；`WaitForFirstConsumer` 把决定权交回调度器，顺序才对。\n\n**两个衍生坑**\n\n- **默认值是 `Immediate`**，所以本地存储的 StorageClass 必须**显式**写 `volumeBindingMode: WaitForFirstConsumer`。\n- 用了 `WaitForFirstConsumer` 就**别在 Pod 里写 `nodeName`** —— 那会绕过调度器，PVC 直接卡 `pending`。要指定节点用 `nodeSelector: kubernetes.io/hostname`。\n\n**本项目落点 + 本地实测（2026-10-16）**  \n`infra/k8s/postgres.yaml` 的 `volumeClaimTemplates` 没写 `storageClassName`，走的是 kind 自带的默认 SC。现场查：\n\n```\n$ kubectl get sc -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner,BINDMODE:.volumeBindingMode,DEFAULT:...\nstandard   rancher.io/local-path   WaitForFirstConsumer   Delete   true\n```\n\n—— 默认 SC 的 BINDMODE 就是 **`WaitForFirstConsumer`**，这就是为什么在 kind 上从没踩到上面那个坑（换成云上 Immediate 的 SC，同一份 YAML 就可能挂）。\n\n**一句话判据**  \n`kubectl get sc -o custom-columns=NAME:.metadata.name,BINDMODE:.volumeBindingMode` —— 本地/云盘 SC 的 BINDMODE 一栏应该是 `WaitForFirstConsumer`。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g014", "type": "single_hop", "question": "本地盘或云盘这类只在部分节点可达的存储，用默认的 Immediate 绑定会出什么问题？", "must_refuse": false, "source": "evals/corpus/k8s-concepts.md", "hint": "## 1. StorageClass 的 `volumeBindingMode`", "criteria": "", "group": "evals/corpus/k8s-concepts.md", "options": ["- 默认值是 Immediate，所以本地存储的 StorageClass 必须显式写 volumeBindingMode: WaitForFirstConsumer。", "—— 默认 SC 的 BINDMODE 就是 WaitForFirstConsumer，这就是为什么在 kind 上从没踩到上面那个坑（换成云上 Immediate 的 SC，同一份 YAML 就可能挂）。", "一句话判据", "一句话定义", "验收标准：每个概念能一句话说清，且能举出一个「以为是这样、其实不是」的反例。", "它描述「哪些 Pod 允许和哪些 Pod 通信」；语义是声明式的：没配任何策略 = 全通；一旦有策略选中某个 Pod = 该 Pod 默认拒绝，只有策略里显式 allow 的方向才放行。", "它决定「PVC 什么时候变成已绑定的 PV」：Immediate（未设置时的默认值）在 PVC 一创建就绑定并动态制备；WaitForFirstConsumer 则推迟到第一个使用该 PVC 的 Pod 被创建时，好让调度器把 Pod 的拓扑约束（资源需求 / nodeSelector / 亲和反亲和 / 污点容忍）算进去。", "⚠️ 反例（以为是这样、其实不是）", "以为「Immediate 是默认值，说明它更快更好，本地盘也该用它」。实际相反：本地盘、云盘这类只在部分节点可达的存储，用 Immediate 会在「还不知道 Pod 会调度到哪」的时候就随便挑一个节点把 PV 建好 —— Pod 后来被调度到别的节点，就永远 Pending（事件里是 node(s) had volume node affinity conflict）。", "两个衍生坑", "本项目落点 + 本地实测（2026-10-16）", "infra/k8s/postgres.yaml 的 volumeClaimTemplates 没写 storageClassName，走的是 kind 自带的默认 SC。现场查：", "以为「停压就该立刻缩回」。实际缩容有 5 分钟稳定窗口：算法取窗口内所有历史建议值的最大值，所以要连续 5 分钟都建议缩小才真缩。（D7 实测：CPU 100 秒就掉到 6%，副本数死守 5 到第 360 秒。）", "绑定 PV 需要知道「卷在哪」；调度 Pod 又需要知道「卷在哪」才能挑节点 —— 这是个鸡生蛋问题。Immediate 单方面先绑，等于替调度器做了它做不了的 ress，等 10s", "`IngressClass` 是一个**集群级**资源，代表「一类 Ingress 由哪个控制器实现」；Ingress 通过 `spec.ingressClassName` **引用**它，它再用 `spec.controller`（如 `k8s.io/ingress-nginx`）指向真正的控制器 —— 即 **`Ingress → IngressClass → 控制器`** 三级引用。", "- **无选择算符的无头 Service**：需要自己管 Endpoints，且 `port` 必须与 `targetPort` 一致。", "**三个容易混的点**", "- **`ingressClassName` 不是控制器名**，是 **IngressClass 资源的名字**（控制器名在 `IngressClass.spec.controller` 里）。名字对不上照样不生效。", "- **旧注解 `kubernetes.io/ingress.class` 已废弃**，且与 `ingressClassName` **不完全等价**（旧注解直接写控制器名；新字段引用的是带额外配置的 IngressClass 资源）。本仓库统一用新字段。", "RBAC 就是「**谁**（Subject）**能对什么**（Resource）**做什么**（Verb）」：**Role / ClusterRole 定义权限集合**，**RoleBinding / ClusterRoleBinding 把权限授予主体**（User / Group / ServiceAccount）；Role 与 RoleBinding 是**命名空间级**，ClusterRole 与 ClusterRoleBinding 是**集群级**。", "`infra/k8s/llmops-chart/templates/ingress.yaml` 里 `ingressClassName: {{ .Values.ingress.className }}` —— **className 为空时整行不渲染**，于是就没有类，Ingress 静默失效。", "现场把这条反例做了一遍："], "original": "\n**一句话定义**  \n`IngressClass` 是一个**集群级**资源，代表「一类 Ingress 由哪个控制器实现」；Ingress 通过 `spec.ingressClassName` **引用**它，它再用 `spec.controller`（如 `k8s.io/ingress-nginx`）指向真正的控制器 —— 即 **`Ingress → IngressClass → 控制器`** 三级引用。\n\n**⚠️ 反例（以为是这样、其实不是）**  \n以为「集群里装了 ingress-nginx，我写的 Ingress 就会自动生效」。实际：**Ingress 必须指定一个类**，否则没有控制器会认领它 —— `kubectl get ingress` 的 `ADDRESS` 一栏是空的，外部访问直接 404 / 连不上。这也是本项目 `infra/k8s/ingress.yaml` 里专门写了一句注释的原因。\n\n**三个容易混的点**\n\n- **`ingressClassName` 不是控制器名**，是 **IngressClass 资源的名字**（控制器名在 `IngressClass.spec.controller` 里）。名字对不上照样不生效。\n- **默认类**：给某个 IngressClass 打注解 `ingressclass.kubernetes.io/is-default-class: \"true\"`，未指定 `ingressClassName` 的新 Ingress 才会被赋上它。**同一时刻只允许一个默认类**，否则准入控制器会拦掉新建的 Ingress。\n- **旧注解 `kubernetes.io/ingress.class` 已废弃**，且与 `ingressClassName` **不完全等价**（旧注解直接写控制器名；新字段引用的是带额外配置的 IngressClass 资源）。本仓库统一用新字段。\n\n**本项目落点 + 本地实测（2026-10-16）**  \n`infra/k8s/llmops-chart/templates/ingress.yaml` 里 `ingressClassName: {{ .Values.ingress.className }}` —— **className 为空时整行不渲染**，于是就没有类，Ingress 静默失效。\n\n e` 必须指向一个 headless Service** —— 这是它「稳定网络标识」的前提（配合 `hostname` + `subdomain`，每个 Pod 才有 `<pod>.<svc>.<ns>.svc.cluster.local` 这种稳定域名）。", "- **`publishNotReadyAddresses: true`** 时，**未就绪**的 Pod 也会被解析到 —— 对「先组集群再变就绪」的 StatefulSet 是必需的，对普通服务则是坑。", "**本项目落点 + 本地实测（2026-10-16）**", "`infra/k8s/postgres.yaml` 里 `clusterIP: None` 就是无头 —— 因为它是 StatefulSet 的 `serviceName`，要的就是「每个 Pod 一个稳定域名」而不是一个 VIP。", "`spec.clusterIP: None` 的 Service 叫**无头 Service**：它**不分配 ClusterIP**、`kube-proxy` 不处理它、平台不提供负载均衡或路由 —— 取而代之的是**内部 DNS 直接返回它后端各 Pod 的 A/AAAA 记录**（即一组 Pod IP），让客户端自己决定连哪一个。", "`kubectl auth can-i get configmap/xxx --as=system:serviceaccount:<ns>:<sa> -n <ns>` —— 自己那一个 yes，别人的 / Secret / 跨命名空间都是 no。", "**三个衍生点**", "> **实测状态**：6 条里 **5 条已在 kind 上现场复现**（NetworkPolicy 于 10-15 实测，其余 4 条于 10-16 实测）；", "现场三种解析对比（在 `default/llmops-api` Pod 里用 Python `getaddrinfo` 查）：", "- **旧注解 `kubernetes.io/ingress.class` 已废弃**，且与 `ingressClassName` **不完全等价**（旧注解直接写控制器名；新字段引用的是带额外配置的 IngressClass 资源）。本仓库统一用新字段。"], "original": "\n**一句话定义**  \n`spec.clusterIP: None` 的 Service 叫**无头 Service**：它**不分配 ClusterIP**、`kube-proxy` 不处理它、平台不提供负载均衡或路由 —— 取而代之的是**内部 DNS 直接返回它后端各 Pod 的 A/AAAA 记录**（即一组 Pod IP），让客户端自己决定连哪一个。\n\n**⚠️ 反例（以为是这样、其实不是）**  \n以为「headless Service 也是 Service，所以也返回一个固定的稳定 IP」。实际它返回的是**一串 Pod IP**（每个就绪 Pod 一条 A 记录），Pod 增减记录就变 —— 客户端要自己做轮询 / 客户端侧负载均衡，否则永远连第一个。它换来的是「**能看见每个后端**」而不是「一个 VIP」。\n\n**三个衍生点**\n\n- **无头 ≠ StatefulSet 专属**：普通 Deployment 也能用无头 Service（只是没有稳定身份）。反过来，**StatefulSet 的 `spec.serviceName` 必须指向一个 headless Service** —— 这是它「稳定网络标识」的前提（配合 `hostname` + `subdomain`，每个 Pod 才有 `<pod>.<svc>.<ns>.svc.cluster.local` 这种稳定域名）。\n- **无选择算符的无头 Service**：需要自己管 Endpoints，且 `port` 必须与 `targetPort` 一致。\n- **`publishNotReadyAddresses: true`** 时，**未就绪**的 Pod 也会被解析到 —— 对「先组集群再变就绪」的 StatefulSet 是必需的，对普通服务则是坑。\n\n**本项目落点 + 本地实测（2026-10-16）**  \n`infra/k8s/postgres.yaml` 里 `clusterIP: None` 就是无头 —— 因为它是 StatefulSet 的 `serviceName`，要的就是「每个 Pod 一个稳定域名」而不是一个 VIP。\n\n现场三种解析对比（在 `default/llmops-api` Pod 里用 Python `getaddrinfo` 查）：\n\n```\n$ kubectl get svc -A | grep -E \"postgres|llmops-api\"\ndefault   llmops-api   ClusterIP   <CLUSTER-IP>   ...   ← 普通 Service：一个 VIP\ndefault   postgres     ClusterIP   None           ...   ← 无头", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g018", "type": "single_hop", "question": "RBAC 的三层模型分别是什么，Role 与 ClusterRole 的作用域怎么分？", "must_refuse": false, "source": "evals/corpus/k8s-concepts.md", "hint": "## 4. RBAC 的三层模型", "criteria": "", "group": "evals/corpus/k8s-concepts.md", "options": ["以为「ClusterRole 必须配 ClusterRoleBinding，Role 必须配 RoleBinding，两边不能交叉」。实际 RoleBinding 可以引用 ClusterRole —— 此时那套权限只在 RoleBinding 所在的命名空间生效，这是复用一套权限模板给多个命名空间的常规手法。反过来不行：ClusterRoleBinding 不能引用 Role（Role 是命名空间内的，绑不到集群范围）。", "以为「headless Service 也是 Service，所以也返回一个固定的稳定 IP」。实际它返回的是一串 Pod IP（每个就绪 Pod 一条 A 记录），Pod 增减记录就变 —— 客户端要自己做轮询 / 客户端侧负载均衡，否则永远连第一个。它换来的是「能看见每个后端」而不是「一个 VIP」。", "一句话判据", "一句话定义", "⚠️ 反例（以为是这样、其实不是）", "- 「零 Role」不等于「零权限」：ServiceAccount 天生带 cluster-scoped 的只读 API discovery 权限（/api/、/healthz、/version）。所谓「最小权限」是收敛到内置基线，不是收敛到零。（D7 双路实测：容器内用自带 token 打 API Server，读自己那一个 ConfigMap 200，读同命名空间别人的 403。）", "- publishNotReadyAddresses: true 时，未就绪的 Pod 也会被解析到 —— 对「先组集群再变就绪」的 StatefulSet 是必需的，对普通服务则是坑。", "- 旧注解 kubernetes.io/ingress.class 已废弃，且与 ingressClassName 不完全等价（旧注解直接写控制器名；新字段引用的是带额外配置的 IngressClass 资源）。本仓库统一用新字段。", "本项目落点 + 本地实测（2026-10-16）", "infra/k8s/llmops-chart/templates/rbac.yaml（Role + RoleBinding）—— 应用用专属 ServiceAccount 跑。dev 里那份 Role 的实际规则只有两条：", "RBAC 就是「谁（Subject）能对什么（Resource）做什么（Verb）」：Role / ClusterRole 定义权限集合，RoleBinding / ClusterRoleBinding 把权限授予主体（User / Group / ServiceAccount）；Role 与 RoleBinding 是命名空间级，ClusterRole 与 ClusterRoleBinding 是集群级。", "两个衍生点", "- 绑定决定作用域，角色决定内容 —— 同一份 ClusterRole 被 RoleBinding 引用 = 只在本命名空间生效；被 ClusterRoleBinding 引用 = 全集群生效。", "用 auth can-i 逐条打（--as=system:serviceaccount:dev:llmops-dev-llmops-chart）：", "—— 边界正好卡在「这一个 ConfigMap + 读 Pod」，多一格都不给。注意这里用的是 Role + RoleBinding；如果把同一份规则写成 ClusterRole、再用 RoleBinding 引用，效果完全一样（作用域由 Binding 决定），这就是上面反例说的情况。", "kubectl auth can-i get configmap/xxx --as=system:serviceaccount:<ns>:<sa> -n <ns> —— 自己那一个 yes，别人的 / Secret / 跨命名空间都是 no。"], "values": ["以为「ClusterRole 必须配 ClusterRoleBinding，Role 必须配 RoleBinding，两边不能交叉」。实际 **RoleBinding 可以引用 ClusterRole** —— 此时那套权限**只在 RoleBinding 所在的命名空间生效**，这是复用一套权限模板给多个命名空间的常规手法。**反过来不行**：ClusterRoleBinding 不能引用 Role（Role 是命名空间内的，绑不到集群范围）。", "以为「headless Service 也是 Service，所以也返回一个固定的稳定 IP」。实际它返回的是**一串 Pod IP**（每个就绪 Pod 一条 A 记录），Pod 增减记录就变 —— 客户端要自己做轮询 / 客户端侧负载均衡，否则永远连第一个。它换来的是「**能看见每个后端**」而不是「一个 VIP」。", "**一句话判据**", "**一句话定义**", "**⚠️ 反例（以为是这样、其实不是）**", "- **「零 Role」不等于「零权限」**：ServiceAccount 天生带 cluster-scoped 的只读 API discovery 权限（`/api/*`、`/healthz`、`/version`）。所谓「最小权限」是**收敛到内置基线**，不是收敛到零。（D7 双路实测：容器内用自带 token 打 API Server，读自己那一个 ConfigMap 200，读同命名空间别人的 403。）", "- **`publishNotReadyAddresses: true`** 时，**未就绪**的 Pod 也会被解析到 —— 对「先组集群再变就绪」的 StatefulSet 是必需的，对普通服务则是坑。", "- **旧注解 `kubernetes.io/ingress.class` 已废弃**，且与 `ingressClassName` **不完全等价**（旧注解直接写控制器名；新字段引用的是带额外配置的 IngressClass 资源）。本仓库统一用新字段。", "**本项目落点 + 本地实测（2026-10-16）**", "`infra/k8s/llmops-chart/templates/rbac.yaml`（Role + RoleBinding）—— 应用用专属 ServiceAccount 跑。dev 里那份 Role 的实际规则只有两条：", "RBAC 就是「**谁**（Subject）**能对什么**（Resource）**做什么**（Verb）」：**Role / ClusterRole 定义权限集合**，**RoleBinding / ClusterRoleBinding 把权限授予主体**（User / Group / ServiceAccount）；Role 与 RoleBinding 是**命名空间级**，ClusterRole 与 ClusterRoleBinding 是**集群级**。", "**两个衍生点**", "- **绑定决定作用域，角色决定内容** —— 同一份 ClusterRole 被 RoleBinding 引用 = 只在本命名空间生效；被 ClusterRoleBinding 引用 = 全集群生效。", "用 `auth can-i` 逐条打（`--as=system:serviceaccount:dev:llmops-dev-llmops-chart`）：", "—— 边界正好卡在「**这一个** ConfigMap + 读 Pod」，多一格都不给。注意这里用的是 **Role + RoleBinding**；如果把同一份规则写成 **ClusterRole**、再用 **RoleBinding** 引用，效果完全一样（作用域由 Binding 决定），这就是上面反例说的情况。", "`kubectl auth can-i get configmap/xxx --as=system:serviceaccount:<ns>:<sa> -n <ns>` —— 自己那一个 yes，别人的 / Secret / 跨命名空间都是 no。"], "original": "\n**一句话定义**  \nRBAC 就是「**谁**（Subject）**能对什么**（Resource）**做什么**（Verb）」：**Role / ClusterRole 定义权限集合**，**RoleBinding / ClusterRoleBinding 把权限授予主体**（User / Group / ServiceAccount）；Role 与 RoleBinding 是**命名空间级**，ClusterRole 与 ClusterRoleBinding 是**集群级**。\n\n**⚠️ 反例（以为是这样、其实不是）**  \n以为「ClusterRole 必须配 ClusterRoleBinding，Role 必须配 RoleBinding，两边不能交叉」。实际 **RoleBinding 可以引用 ClusterRole** —— 此时那套权限**只在 RoleBinding 所在的命名空间生效**，这是复用一套权限模板给多个命名空间的常规手法。**反过来不行**：ClusterRoleBinding 不能引用 Role（Role 是命名空间内的，绑不到集群范围）。\n\n**两个衍生点**\n\n- **绑定决定作用域，角色决定内容** —— 同一份 ClusterRole 被 RoleBinding 引用 = 只在本命名空间生效；被 ClusterRoleBinding 引用 = 全集群生效。\n- **「零 Role」不等于「零权限」**：ServiceAccount 天生带 cluster-scoped 的只读 API discovery 权限（`/api/*`、`/healthz`、`/version`）。所谓「最小权限」是**收敛到内置基线**，不是收敛到零。（D7 双路实测：容器内用自带 token 打 API Server，读自己那一个 ConfigMap 200，读同命名空间别人的 403。）\n\n**本项目落点 + 本地实测（2026-10-16）**  \n`infra/k8s/llmops-chart/templates/rbac.yaml`（Role + RoleBinding）—— 应用用专属 ServiceAccount 跑。dev 里那份 Role 的实际规则只有两条：\n\n```json\n[{\"apiGroups\":[\"\"],\"resourceNames\":[\"llmops-dev-llmops-chart-config\"],\"resources\":[\"configmaps\"],\"verbs\":[\"get\"]},\n {\"apiGroups\":[\"\"],\"resources\":[\"pods\"],\"verbs\":[\"get\",\"list\"]}]\n```\n\n用 `auth can-i` 逐条打（`--as=system:serviceaccount:dev:llmops-dev-llmops-chart`）：\n\n| 请求                                                            | 结果      |\n| ------------------------------------------------------------- | ------- |\n| `get configmap/llmops-dev-llmops-chart-config -n dev`（自己的）    | **yes** |\n| `get configmap/kube-root-ca.crt -n dev`（同命名空间别人的）             | **no**  |\n| `get secrets -n dev`                                          | **no**  |\n| `get configmap/llmops-dev-llmops-chart-config -n prod`（跨命名空间） | **no**  |\n| `list pods -n dev`                                            | **yes** |\n\n—— 边界正好卡在「**这一个** ConfigMap + 读 Pod」，多一格都不给。注意这里用的是 **Role + RoleBinding**；如果把同一份规则写成 **ClusterRole**、再用 **RoleBinding** 引用，效果完全一样（作用域由 Binding 决定），这就是上面反例说的情况。\n\n**一句话判据**  \n`kubectl auth can-i get configmap/xxx --as=system:serviceaccount:<ns>:<sa> -n <ns>` —— 自己那一个 yes，别人的 / Secret / 跨命名空间都是 no。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": true}, {"id": "g019", "type": "single_hop", "question": "RoleBinding 引用 ClusterRole 时，那套权限在哪个范围生效？反过来为什么不行？", "must_refuse": false, "source": "evals/corpus/k8s-concepts.md", "hint": "## 4. RBAC 的三层模型", "criteria": "", "group": "evals/corpus/k8s-concepts.md", "options": ["以为「ClusterRole 必须配 ClusterRoleBinding，Role 必须配 RoleBinding，两边不能交叉」。实际 RoleBinding 可以引用 ClusterRole —— 此时那套权限只在 RoleBinding 所在的命名空间生效，这是复用一套权限模板给多个命名空间的常规手法。反过来不行：ClusterRoleBinding 不能引用 Role（Role 是命名空间内的，绑不到集群范围）。", "一句话判据", "一句话定义", "⚠️ 反例（以为是这样、其实不是）", "infra/k8s/llmops-chart/templates/ingress.yaml 里 ingressClassName: {{ .Values.ingress.className }} —— className 为空时整行不渲染，于是就没有类，Ingress 静默失效。", "- 「零 Role」不等于「零权限」：ServiceAccount 天生带 cluster-scoped 的只读 API discovery 权限（/api/、/healthz、/version）。所谓「最小权限」是收敛到内置基线，不是收敛到零。（D7 双路实测：容器内用自带 token 打 API Server，读自己那一个 ConfigMap 200，读同命名空间别人的 403。）", "以为「Immediate 是默认值，说明它更快更好，本地盘也该用它」。实际相反：本地盘、云盘这类只在部分节点可达的存储，用 Immediate 会在「还不知道 Pod 会调度到哪」的时候就随便挑一个节点把 PV 建好 —— Pod 后来被调度到别的节点，就永远 Pending（事件里是 node(s) had volume node affinity conflict）。", "本项目落点 + 本地实测（2026-10-16）", "infra/k8s/llmops-chart/templates/rbac.yaml（Role + RoleBinding）—— 应用用专属 ServiceAccount 跑。dev 里那份 Role 的实际规则只有两条：", "spec.clusterIP: None 的 Service 叫无头 Service：它不分配 ClusterIP、kube-proxy 不处理它、平台不提供负载均衡或路由 —— 取而代之的是内部 DNS 直接返回它后端各 Pod 的 A/AAAA 记录（即一组 Pod IP），让客户端自己决定连哪一个。", "RBAC 就是「谁（Subject）能对什么（Resource）做什么（Verb）」：Role / ClusterRole 定义权限集合，RoleBinding / ClusterRoleBinding 把权限授予主体（User / Group / ServiceAccount）；Role 与 RoleBinding 是命名空间级，ClusterRole 与 ClusterRoleBinding 是集群级。", "两个衍生点", "- 绑定决定作用域，角色决定内容 —— 同一份 ClusterRole 被 RoleBinding 引用 = 只在本命名空间生效；被 ClusterRoleBinding 引用 = 全集群生效。", "用 auth can-i 逐条打（--as=system:serviceaccount:dev:llmops-dev-llmops-chart）：", "—— 边界正好卡在「这一个 ConfigMap + 读 Pod」，多一格都不给。注意这里用的是 Role + Ro 8 代理通、13:37 代理死但直连通）→ 凡涉及下载的结论，一律以用户真实终端为准，沙箱结果只作参考。", "或 Failed to connect to github.com:443 after 21154 ms。", "- github.com 直连不通（curl --noproxy '' → 000 超时）", "- 注册表里的 9527 是活的（走它打 github.com → 200）", "修法：显式把代理指到注册表端口", "💡 想一劳永逸，写进本仓库配置（只影响这个仓库）：", "bash", "git config http.proxy http://127.0.0.1:9527", "git config https.proxy http://127.0.0.1:9527", "探活一行（推之前跑，确认端口活着）：", "git -c http.proxy=http://127.0.0.1:9527 -c https.proxy=http://127.0.0.1:9527 push origin main"], "values": ["> > [!danger] ⚠️ 2026-10-07 17:40 更正：**`unset` 环境变量并不能真正禁用代理**", "> ⚠️ 但**端口哪天再变就得改**，所以更稳的是「推之前先探活」。", "- 而 git 默认读 **env** 里的代理端口 —— 今天那个是 **3315，已经死了**", "**⚠️ 一个反直觉点**：`api.github.com` **直连可达**（200），但 `github.com` **直连不通**。", "所以「`gh` 命令能用」**不代表**「`git push` 能用」—— 两者走的是不同域名。", "> → 所以**别把「清华源不能用」写死**，结论必须带**版本号 + 时间戳**。", "**症状**：`git push` 报 `schannel: server closed abruptly (missing close_notify)`，", "> ⚠️ **沙箱的网络时通时不通**（10:48 代理通、13:37 代理死但直连通）→ **凡涉及下载的结论，一律以用户真实终端为准**，沙箱结果只作参考。", "或 `Failed to connect to github.com:443 after 21154 ms`。", "- **`github.com` 直连不通**（`curl --noproxy '*'` → **000 超时**）", "- **注册表里的 `9527` 是活的**（走它打 `github.com` → **200**）", "**修法：显式把代理指到注册表端口**", "> 💡 想一劳永逸，写进本仓库配置（**只影响这个仓库**）：", "> ```bash", "> git config http.proxy http://127.0.0.1:9527", "> git config https.proxy http://127.0.0.1:9527", "**探活一行**（推之前跑，确认端口活着）：", "git -c http.proxy=http://127.0.0.1:9527 -c https.proxy=http://127.0.0.1:9527 push origin main"], "original": "\n**症状**：`git push` 报 `schannel: server closed abruptly (missing close_notify)`，\n或 `Failed to connect to github.com:443 after 21154 ms`。\n\n**根因**：\n- **`github.com` 直连不通**（`curl --noproxy '*'` → **000 超时**）\n- 而 git 默认读 **env** 里的代理端口 —— 今天那个是 **3315，已经死了**\n- **注册表里的 `9527` 是活的**（走它打 `github.com` → **200**）\n\n**修法：显式把代理指到注册表端口**\n\n```bash\ngit -c http.proxy=http://127.0.0.1:9527 -c https.proxy=http://127.0.0.1:9527 push origin main\n```\n\n> 💡 想一劳永逸，写进本仓库配置（**只影响这个仓库**）：\n> ```bash\n> git config http.proxy http://127.0.0.1:9527\n> git config https.proxy http://127.0.0.1:9527\n> ```\n> ⚠️ 但**端口哪天再变就得改**，所以更稳的是「推之前先探活」。\n\n**探活一行**（推之前跑，确认端口活着）：\n\n```bash\ncurl -x http://127.0.0.1:9527 --max-time 5 -sS -o /dev/null -w \"%{http_code}\\n\" https://github.com\n```\n\n**⚠️ 一个反直觉点**：`api.github.com` **直连可达**（200），但 `github.com` **直连不通**。\n所以「`gh` 命令能用」**不代表**「`git push` 能用」—— 两者走的是不同域名。\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g029", "type": "single_hop", "question": "本机为 HuggingFace 镜像配了哪些环境变量？", "must_refuse": false, "source": "evals/corpus/env-setup.md", "hint": "## 3. HuggingFace 镜像（✅ 2026-10-07 已配置）", "criteria": "", "group": "evals/corpus/env-setup.md", "options": ["⚠️ 当前已开的终端不会继承 —— setx 只对新进程生效，新开一个终端再用。", "连通性实测：https://hf-mirror.com 返回 307（正常跳转），绕代理与走代理均可。", "> 想确认当前到底走不走代理、走哪个端口，跑：", "HF_ENDPOINT 已写入用户级环境变量（注册表 HKCU\\Environment 已核实）：", "bash", "如需重设或撤销：", "- 用 urllib 直连 hf-mirror 会 403，要加 --noproxy '' 绕开代理", "- snapshot_download 可能被钩子打断 → 改用 curl 逐文件取", "- ⚠️ WSL 服务名变了：新版是 WslService（Start=2 自动），旧的 LxssManager 已不存在。", "- Windows 下 huggingface_hub 建符号链接常失败，snapshots/ 会留 0 字节空文件（blobs/ 完整、du 看不出）→ 加载报 File model.bin is incomplete。别重下，用硬链接修复", "HF_ENDPOINT = https://hf-mirror.com", "setx HF_ENDPOINT \"https://hf-mirror.com\"     # 设置"], "values": ["⚠️ **当前已开的终端不会继承** —— `setx` 只对新进程生效，**新开一个终端**再用。", "连通性实测：`https://hf-mirror.com` 返回 **307**（正常跳转），绕代理与走代理均可。", "> > 想**确认**当前到底走不走代理、走哪个端口，跑：", "`HF_ENDPOINT` **已写入用户级环境变量**（注册表 `HKCU\\Environment` 已核实）：", "> ```bash", "如需重设或撤销：", "- 用 `urllib` 直连 hf-mirror 会 **403**，要加 `--noproxy '*'` 绕开代理", "- `snapshot_download` 可能被钩子打断 → 改用 `curl` 逐文件取", "- ⚠️ **WSL 服务名变了**：新版是 **`WslService`**（Start=2 自动），**旧的 `LxssManager` 已不存在**。", "- Windows 下 `huggingface_hub` 建符号链接常失败，`snapshots/` 会留 **0 字节空文件**（`blobs/` 完整、`du` 看不出）→ 加载报 `File model.bin is incomplete`。**别重下**，用硬链接修复", "HF_ENDPOINT = https://hf-mirror.com", "setx HF_ENDPOINT \"https://hf-mirror.com\"     # 设置"], "original": "\n`HF_ENDPOINT` **已写入用户级环境变量**（注册表 `HKCU\\Environment` 已核实）：\n\n```\nHF_ENDPOINT = https://hf-mirror.com\n```\n\n⚠️ **当前已开的终端不会继承** —— `setx` 只对新进程生效，**新开一个终端**再用。\n\n连通性实测：`https://hf-mirror.com` 返回 **307**（正常跳转），绕代理与走代理均可。\n\n如需重设或撤销：\n\n```bash\nsetx HF_ENDPOINT \"https://hf-mirror.com\"     # 设置\nreg delete HKCU\\Environment /v HF_ENDPOINT /f  # 撤销（reg.exe 在本会话可能被拦）\n```\n\n已知坑：\n- 用 `urllib` 直连 hf-mirror 会 **403**，要加 `--noproxy '*'` 绕开代理\n- `snapshot_download` 可能被钩子打断 → 改用 `curl` 逐文件取\n- Windows 下 `huggingface_hub` 建符号链接常失败，`snapshots/` 会留 **0 字节空文件**（`blobs/` 完整、`du` 看不出）→ 加载报 `File model.bin is incomplete`。**别重下**，用硬链接修复\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g030", "type": "single_hop", "question": "本机算力现实是什么，有没有 GPU 和可用内存上限？", "must_refuse": false, "source": "evals/corpus/env-setup.md", "hint": "## 4. 本机算力现实", "criteria": "", "group": "evals/corpus/env-setup.md", "options": ["- 无 GPU（CPU-only）。Intel Core Ultra 7 155H / Intel AI Boost NPU（非 Copilot+）", "> bash", "- 22 逻辑核 / 31.5 GB 内存，实际可用约 18 GB", "- 影响：vLLM 与微调在本机只能小规模跑或根本跑不动", "→ 用「托管 API 为主 + 本地小模型（0.5B–1.5B 量化）演示流程」的组合", "⚠️ 只拦清华 —— 同一条 UA 打官方 / 阿里云 / 腾讯云 / 中科大全部 200。", "已逐一排除：代理（走 / 不走代理都 403）、请求头（Accept / Accept-Encoding / Cache-Control 逐组测过）、", "→ 微调租云 GPU 按小时算，比本机折腾便宜"], "values": ["- **无 GPU**（CPU-only）。Intel Core Ultra 7 155H / Intel AI Boost NPU（**非 Copilot+**）", "> > ```bash", "- 22 逻辑核 / 31.5 GB 内存，**实际可用约 18 GB**", "- 影响：**vLLM 与微调在本机只能小规模跑或根本跑不动**", "→ 用「托管 API 为主 + 本地小模型（0.5B–1.5B 量化）演示流程」的组合", "> ⚠️ **只拦清华** —— 同一条 UA 打官方 / 阿里云 / 腾讯云 / 中科大**全部 200**。", "> **已逐一排除**：代理（走 / 不走代理都 403）、请求头（`Accept` / `Accept-Encoding` / `Cache-Control` 逐组测过）、", "→ 微调租云 GPU 按小时算，比本机折腾便宜"], "original": "\n- **无 GPU**（CPU-only）。Intel Core Ultra 7 155H / Intel AI Boost NPU（**非 Copilot+**）\n- 22 逻辑核 / 31.5 GB 内存，**实际可用约 18 GB**\n- 影响：**vLLM 与微调在本机只能小规模跑或根本跑不动**\n  → 用「托管 API 为主 + 本地小模型（0.5B–1.5B 量化）演示流程」的组合\n  → 微调租云 GPU 按小时算，比本机折腾便宜\n\n---", "preselect": [], "preselect_refuse": null, "enumerative": 有 ~130 KB。**\n`docker system df -v` 的 SHARED/UNIQUE 列说明了一切 —— 它们共用 `python:3.12-alpine`\n底座 + venv 层，删掉 4 个 tag 只回收 ≈0.5 MB。\n\n**但可回收总量反而从 1.39 GB 涨到 1.513 GB**，因为删掉共享引用后，\n`python:3.12-alpine`（83.6 MB，容器数 0）等底座镜像进入了可回收范围。\n这也解释了为什么 `docker system df` 的 Images SIZE 略有上升（18.37 → 18.44 GB）——\n总大小统计方式与 tag 数量无关，别被这个数字误导。\n\n> **结论：旧 tag 清理的收益主要是「列表清爽 + 语义清晰」，不是省磁盘。**\n> 真正能回收的大头在别处（`metrics-server` 111 MB、Build Cache 36 MB、python 底座 83.6 MB），\n> 而最大的那个 —— `hpa-example` 736 MB —— 已单独处理，见 §4.3。", "preselect": [], "preselect_refuse": null, "enumerative": false}, {"id": "g037", "type": "single_hop", "question": "清 hpa-example 那 736 MB 时，先 untag 为什么没能真正删掉？", "must_refuse": false, "source": "evals/corpus/resource-ledger.md", "hint": "### 4.3 清 hpa-example 736 MB：先 untag 一次没删掉的坑（10-16 实测）", "criteria": "", "group": "evals/corpus/resource-ledger.md", "options": ["判据：docker images -a 里看到同名仓库 + 镜像 ID 相同 = 有多别名，必须逐个 untag", "⚠️ 保留项：kind 节点内有 hpa-example 自己的 166 MB 副本（ID 4ca4c13a6d7cc，与宿主那个不是同一镜像），", "所以 infra/k8s/hpa-demo/php-apache.yaml（imagePullPolicy: IfNotPresent）仍可直接 apply，", "第一次 docker rmi registry.k8s.io/hpa-example:latest 只输出 Untagged:、没有 Deleted:，", "结论：旧 tag 清理的收益主要是「列表清爽 + 语义清晰」，不是省磁盘。", "docker system df 毫无变化。根因不是\"图层被引用\"，而是同一个镜像 ID 上有两个 tag：", "即当时是从华为云 K8s 镜像仓库拉下来的，registry.k8s.io 只是个后加的别名。", "直到出现 Deleted: 才算真删。补删华为云那条 tag 后才 Deleted: sha256:93c2a5cc…。", "HPA 压测峰值实测（dev，12 并发 × 120s 打 /work）：", "磁盘约 24 GB（Docker 内部）／34 GB（vhdx）。CPU 不是瓶颈，内存和磁盘才是 ——", "实际收益：Images 18.44 GB → 17.7 GB，可回收 1.513 GB → 776.6 MB（回收 ≈740 MB，与预估 736 MB 吻合）。", "宿主删掉不影响 HPA 演示。"], "values": ["**判据：`docker images -a` 里看到同名仓库 + 镜像 ID 相同 = 有多别名**，必须逐个 untag", "> ⚠️ 保留项：kind 节点内有 `hpa-example` 自己的 166 MB 副本（ID `4ca4c13a6d7cc`，与宿主那个不是同一镜像），", "> 所以 `infra/k8s/hpa-demo/php-apache.yaml`（`imagePullPolicy: IfNotPresent`）**仍可直接 apply**，", "第一次 `docker rmi registry.k8s.io/hpa-example:latest` 只输出 `Untagged:`、**没有 `Deleted:`**，", "> **结论：旧 tag 清理的收益主要是「列表清爽 + 语义清晰」，不是省磁盘。**", "`docker system df` 毫无变化。根因     };
  });
  return { source: "w6d3_quiz", exported_at: new Date().toISOString(), answers: answers };
}
function exportJSON() {
  const p = payload();
  const blob = new Blob([JSON.stringify(p, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "w6d3_quiz_answers.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  document.getElementById("msg").textContent = "已导出 " + Object.keys(p.answers).length + " 题";
}
function copyJSON() {
  const text = JSON.stringify(payload(), null, 2);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => document.getElementById("msg").textContent = "已复制到剪贴板",
      () => fallbackCopy(text)
    );
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); document.getElementById("msg").textContent = "已复制到剪贴板"; }
  catch (e) { document.getElementById("msg").textContent = "复制失败，请改用「导出答案 JSON」"; }
  document.body.removeChild(ta);
}
function importJSON() { document.getElementById("fileIn").click(); }
document.getElementById("fileIn").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      const ans = obj.answers || {};
      Object.keys(ans).forEach(id => {
        const a = ans[id], it = DATA.items.find(x => x.id === id);
        if (!it) return;
        let ri = (a.refuse_index === undefined || a.refuse_index === null) ? null : a.refuse_index;
        if (it.must_refuse && ri === null && a.reference) {
          const idx = it.options.indexOf(a.reference);
          if (idx >= 0) ri = idx;
        }
        state[id] = { question: a.question || it.question, picks: a.atoms || [], refuse: ri };
      });
      save(); render();
      document.getElementById("msg").textContent = "已导入 " + Object.keys(ans).length + " 题";
    } catch (e) { document.getElementById("msg").textContent = "导入失败：不是合法的答案 JSON"; }
  };
  r.readAsText(f);
});
function expandAll(open) { document.querySelectorAll("details.group").forEach(d => d.open = open); }
function clearAll() {
  if (!confirm("清空本机保存的全部作答？不会改动已导出的文件。")) return;
  state = {}; localStorage.removeItem(KEY); render();
  document.getElementById("msg").textContent = "已清空";
}
render();
</script>
