# =============================================================================
# 监控栈（W5 D1 起）—— 今天只有 Prometheus，D2 加 Grafana
# -----------------------------------------------------------------------------
# 为什么单独一个 compose 文件，不并进 infra/compose.yml：
#   数据库是「应用要连的东西」，监控是「看应用的东西」。两者生命周期不同 ——
#   清库重建（down -v）时不该顺手把监控历史一起删掉，反之亦然。
#   文件分开 = 状态分开 = 不会互相误伤。
#
# 用法（在仓库根）：
#   docker compose -f infra/prometheus/compose.yml up -d
#   curl http://127.0.0.1:9095/-/ready          # 期望 Prometheus Server is Ready.
#   docker compose -f infra/prometheus/compose.yml down
# =============================================================================

name: llmops-observability

services:
  prometheus:
    # ⚠️ 固定版本，不用 latest：Prometheus 3.x 与 2.x 的 PromQL / 配置有差异，
    #    半年后重跑要拿到同一个东西。升级是显式动作，不是 `pull` 的副作用。
    image: prom/prometheus:v3.15.1
    container_name: llmops-prometheus

    ports:
      # 只绑回环 —— 监控面板不该暴露到局域网。
      # ⚠️ 宿主端口默认 9095，不是 Prometheus 默认的 9090：
      #    本机 9090 已被 Langfuse 的 MinIO 占着（`0.0.0.0:9090->9000`），
      #    照抄 9090 会起不来，报 `bind: address already in use`。
      #    容器内仍是 9090 —— prometheus.yml 里抓自己的那条 targets 不用改。
      # ⚠️ 为什么写成 ${PROM_PORT:-9095}：9095 会被**常驻进程随机占用**
      #    （2026-11-02 实测被 tailscaled 绑走），撞上时不用改文件，set 一下环境变量即可：
      #      $env:PROM_PORT="19095"; docker compose ... up -d
      - "127.0.0.1:${PROM_PORT:-9095}:9090"

    volumes:
      # 配置只读挂载：容器里改不了，逼着改仓库里的文件（配置即代码）
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 时序数据落命名卷：容器删了数据还在，`down` 不等于 `down -v`
      - promdata:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 本地只留 7 天。⚠️ 默认 15 天，学习机上没必要 —— 磁盘满了会静默丢数据
      - --storage.tsdb.retention.time=7d
      # 允许 POST /-/reload 热加载配置（改 prometheus.yml 后不用重启容器）
      - --web.enable-lifecycle

    extra_hosts:
      # 让 Linux 上的 Docker 也能解析 host.docker.internal（Docker Desktop 自带）。
      # 不加这行，Linux 用户抓宿主机上的应用会一直 DOWN。
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana（W5 D2 加）—— 为什么和 Prometheus 挤在同一个 compose 文件里
  # ---------------------------------------------------------------------------
  # 因为它们是**一套东西的两个半边**：Prometheus 存数，Grafana 画图。
  # 拆成两个 compose 文件，就要手动维护一个 network、手动记住先起谁 ——
  # 而它们的生命周期本来就一致（要清就一起清）。数据库那种「应用要连的东西」
  # 才需要单独一个文件（见 infra/compose.yml 的注释）。
  #
  # 配置全部走「文件挂载」而不是 UI 点击：
  #   provisioning/datasources → 数据源（UI 里加的存 SQLite，换个卷就没了）
  #   provisioning/dashboards  → 告诉 Grafana 去哪读看板 JSON
  #   dashboards/*.json        → 看板本体，进版本库，能被 review
  grafana:
    # 同样钉版本：Grafana 大版本之间面板 schema 会变，latest 半年后可能读不了旧 JSON
    image: grafana/grafana:13.2.5
    container_name: llmops-grafana

    ports:
      # ⚠️ Grafana 默认 3000 —— 本机 3000 被 Langfuse 的 web 占着（0.0.0.0:3000->3000）。
      #    改用 3001；同样可用 $env:GRAFANA_PORT 覆盖。
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    environment:
      # 管理员密码走环境变量，**不写死在文件里**（仓库要能公开）。
      # 本地学习机默认 llmops，别拿去公网用。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-llmops}
      # 关掉自助注册：本地实例没有第二个用户，开了只是多个入口
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 关掉匿名访问：否则同网段任何人打开就是 admin 视图，看不出权限差异
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 关掉三个「往外说话」的开关：学习机没必要给它上报使用数据
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # 打开首页直接落在我们自己的看板上，省一次点鼠标
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llmops-overview.json

    volumes:
      # 数据源与看板提供者：只读，容器里改不了 → 逼着改仓库文件
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      # 看板 JSON 本体：只读同上
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana 自己的状态（用户、偏好、告警历史）落命名卷
      - grafanadata:/var/lib/grafana

    depends_on:
      # 只保证启动顺序，不保证 Prometheus 已经能应答 ——
      # 数据源是「懒连接」，Grafana 起得比 Prometheus 早也不会报错，面板会先显示 No data。
      prometheus:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  promdata:
    name: llmops-prometheus-data
  grafanadata:
    name: llmops-grafana-data
