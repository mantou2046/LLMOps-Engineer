# =============================================================================
# Prometheus 抓取配置 —— W5 D1
# -----------------------------------------------------------------------------
# 这个文件是「Prometheus 该去谁那里拿数」的唯一声明。它自己也该进版本库：
# 改抓取目标 = 改监控范围，得能被 review（和 D2 的看板 JSON 同一个道理）。
#
# 用法（在仓库根）：
#   docker compose -f infra/prometheus/compose.yml up -d
#   docker compose -f infra/prometheus/compose.yml logs -f prometheus
#   docker compose -f infra/prometheus/compose.yml down
# =============================================================================

global:
  # 抓取间隔。⚠️ 它同时是**分辨率上限**：间隔 15s，一个持续 10s 的毛刺就永远看不见。
  # 生产常配 15–30s（因为「基数 × 抓取频率」= 存储与 CPU 成本）；
  # 本地学习用 5s，改一行代码就能马上在图上看到变化，省掉等待。
  scrape_interval: 5s
  # 单次抓取的超时。必须 < scrape_interval，否则两次抓取会重叠、日志里出现
  # 「context deadline exceeded」而你以为目标挂了。
  scrape_timeout: 4s
  # 给所有时序打的外部标签。将来接 Grafana / 联邦 / 远程写时，靠它区分环境。
  external_labels:
    env: local
    project: llmops-engineer

scrape_configs:
  # ---------------------------------------------------------------------------
  # 我们的 FastAPI 服务（app/metrics.py 提供的 /metrics）
  # ---------------------------------------------------------------------------
  - job_name: llmops-api
    metrics_path: /metrics
    static_configs:
      # ⚠️ 关键一行：Prometheus 跑在容器里，应用跑在**宿主机**上。
      #    容器里的 127.0.0.1 是容器自己，抓不到宿主机的 8000。
      #    Docker Desktop（Win/Mac）自带 host.docker.internal 这个名字；
      #    Linux 上要 compose 里的 extra_hosts 才认（见 compose.yml）。
      - targets: ["host.docker.internal:8000"]
        labels:
          # 自定义标签：多环境 / 多实例时用它分组，别把环境写进指标名里
          service: llmops-api

  # ---------------------------------------------------------------------------
  # LiteLLM 网关（W5 D3 加）—— LLM 专属指标的唯一来源
  # ---------------------------------------------------------------------------
  # 为什么单独一个 job、不并进 llmops-api：
  #   两者是**不同的进程、不同的指标语义**。应用的 /metrics 记的是「HTTP 请求」，
  #   网关的 /metrics 记的是「模型调用」（TTFT / 每请求成本 / 缓存命中）。
  #   混在一个 job 里，`up` 就分不清是「应用挂了」还是「网关挂了」。
  #
  # ⚠️ 端口 4001 不是 4000：本机 4000 被「AMD 免费模型可用度监控」占着（见 config.yaml 头注）。
  # ⚠️ 网关跑在**宿主机**上，容器里的 127.0.0.1 抓不到 → 必须走 host.docker.internal。
  # ⚠️ 网关的 /metrics 与代理同端口，且默认不鉴权 —— 所以这里不需要 bearer_token。
  #    但只监听回环（127.0.0.1:4001），别改成 0.0.0.0，否则同网段谁都能读到你的用量与成本。
  #
  # ⚠️ 依赖前置：infra/litellm/config.yaml 里必须有 `litellm_settings.callbacks: ["prometheus"]`，
  #    否则这个 target 永远 DOWN（网关 /metrics 返回 404），报错信息是
  #    `server returned HTTP status 404 Not Found` —— 看着像路径写错，其实是没开开关。
  #
  # ⚠️ metrics_path 末尾那个斜杠**不能省**（2026-11-02 实测）：
  #    LiteLLM 把指标 app 挂成 Starlette 的 mount，请求 `/metrics` 会先返回
  #    **307 → /metrics/**。虽然 Prometheus 会跟这个跳转，但每次抓取多一跳、
  #    日志里留一条 307，排查时容易被当成异常。写全 `/metrics/` 直接 200。
  # ⚠️ 这个端点在 1.106.4 里**默认要鉴权**，鉴权路径依赖 prisma（要 DB）。
  #    本机没跑 DB 代理模式 → 必须靠 config.yaml 的
  #    `require_auth_for_metrics_endpoint: false` 才通，否则永远 401。
  - job_name: litellm-gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          service: litellm-gateway

  # ---------------------------------------------------------------------------
  # Prometheus 自己 —— 白送的，且必须有
  # ---------------------------------------------------------------------------
  # 为什么必须抓自己：它自己的 CPU / 内存 / 时序数（prometheus_tsdb_head_series）
  # 是判断「监控系统本身是不是快撑爆了」的唯一依据。
  # 指标基数失控时，第一个报警的应该是这一条，而不是等它 OOM。
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: prometheus
