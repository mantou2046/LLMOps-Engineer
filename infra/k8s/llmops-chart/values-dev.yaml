# =============================================================================
# values-dev.yaml · 开发环境覆盖值
# -----------------------------------------------------------------------------
# 用法（与 values.yaml 叠加，本文件的键覆盖默认值）：
#   helm install llmops-dev ./llmops-chart -n dev --create-namespace -f values-dev.yaml
#   helm upgrade llmops-dev ./llmops-chart -n dev -f values-dev.yaml
#
# ⚠️ Helm 的 values 合并是**浅合并 + 递归合并 map**，但**列表是整体替换**：
#      values.yaml 的 env 列表若在此处只写一项，另一项会**消失**。
#      所以下面 env 写全两项，不做"只覆盖一个"的想当然操作。
# =============================================================================

# dev 只要 1 个副本：省资源，改起来快
# ⚠️ 下方开了 HPA 后，这个值对 Deployment 失效（副本数由 HPA 接管，
#    起点是 autoscaling.minReplicas）；保留它是为了「关掉 HPA 就能回退」。
replicaCount: 1

# dev 用 dev 标签的镜像（当前与 prod 同镜像，将来可分开）
image:
  repository: llmops-api
  pullPolicy: IfNotPresent
  tag: "0.5.2"

# 资源给宽松些，方便本地随便压测
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ⚠️ 列表整体替换：全部写全
env:
  - name: APP_VERSION
    value: "0.5.2-dev"
  - name: STARTUP_DELAY_SECONDS
    value: "0"
  # dev 打开 /work CPU 压测端点 —— HPA 扩缩容演示要有可控的 CPU 负载源
  - name: ENABLE_LOAD_ENDPOINT
    value: "1"
  # W2 D8 · dev 用 mock 上游：本地演练不必申请真 key，重试/流式照样能验收
  - name: LLM_MODE
    value: "mock"
  - name: LLM_MAX_ATTEMPTS
    value: "3"
  - name: LLM_BACKOFF_MIN
    value: "1"
  - name: LLM_BACKOFF_MAX
    value: "8"
  - name: LLM_TIMEOUT_SECONDS
    value: "60"
  # dev 默认不注入故障；验收重试时 helm upgrade --set env[...] 或临时改成 "2"
  - name: MOCK_FAIL_N_TIMES
    value: "0"
  - name: MOCK_FIRST_TOKEN_MS
    value: "200"
  - name: MOCK_CHUNK_DELAY_MS
    value: "60"
  # W2 D9 · dev 用 "log" 档：集群里通常没部署 Langfuse，
  #   但本地日志里照样能看到每次调用的 trace 一行摘要（token / 成本 / 耗时）。
  #   要在 dev 真的上报，就改成 "langfuse" 并补 LANGFUSE_* 两把 key。
  - name: OBSERVABILITY
    value: "log"

# ConfigMap：dev 环境用 DEBUG 日志、明确标识 APP_ENV=dev
configMap:
  enabled: true
  data:
    APP_ENV: "dev"
    LOG_LEVEL: "DEBUG"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "llmops"
    POSTGRES_USER: "llmops"
    LITELLM_BASE_URL: "http://litellm:4000"
    LITELLM_CACHE_ENABLED: "true"
    # W2 D9 · ConfigMap 也是整体替换 map（与 env 列表同理），要写全
    LANGFUSE_HOST: "http://localhost:3000"
    LANGFUSE_SAMPLE_RATE: "1.0"

# 探针：dev 放宽一些，避免本地资源紧张时误杀
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 2

# HPA：dev 打开，用于演示「压测时自动扩容、停压缩回」
#   目标 50% 是**故意调低**的 —— 本应用 requests.cpu 只有 50m，
#   50% = 25m 的绝对阈值，本地用 /work 压一下就能越过，演示成本低。
#   ⚠️ 真实生产不会用这么低的目标值，否则副本数会长期贴上限、白烧钱。
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

# W2 D7 遗留 · NetworkPolicy（2026-10-15 补齐并实测）
# ⚠️ 实测结论：**kind 的 kindnetd 支持 NetworkPolicy**（v20260820），netpol 真的生效！
#    验证方式：开着 netpol 时，从 default 命名空间的 Pod 访问 dev 的 Service → 超时；
#    关掉 netpol 后同一测试 → 立即返回 200。对比明确。
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  allowIntraNamespace: true
  egress:
    enabled: true
    allowPostgres: true

# W2 D11 · PDB：dev **不开**
#   理由：dev 起点就是单副本（HPA min=1），minAvailable=1 会让 drain 永久卡住，
#   而 maxUnavailable=1 在单副本下等于「允许全拿走」—— 两种口径都没意义。
#   PDB 的价值在多副本场景，留给 prod 演示。
pdb:
  enabled: false

# W2 D11 · 反亲和：dev **不开**
#   本机 kind 只有 1 个节点，开了 soft 也不会真分散（无第二个节点可去）。
#   多节点集群才值得开，见 values-prod.yaml 的说明。
podAntiAffinity:
  enabled: false

# ingress：dev 用独立 host，避免和 prod 抢
# ⚠️ W2 D11 打开：全链路复跑要经 Ingress 访问 Chart 部署的服务（而不只是 W1 的 default 部署）
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: llmops-dev.local
      paths:
        - path: /
          pathType: Prefix
