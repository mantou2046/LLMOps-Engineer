# =============================================================================
# values-secret.example.yaml · Secret 真值的**模板**（本文件要提交）
# -----------------------------------------------------------------------------
# 用法：
#   cp values-secret.example.yaml values-secret.yaml      # 复制一份
#   # 编辑 values-secret.yaml 填入真值（或从 .env 生成）
#   helm install llmops-dev ./llmops-chart -n dev \
#     -f values-dev.yaml -f values-secret.yaml
#
# ⚠️ values-secret.yaml **已被 .gitignore 挡住**，真值不会进仓库。
#    本 example 文件只放占位符，可安全提交。
#
# 从 .env 生成（避免手动复制粘贴出错）：
#   cp values-secret.example.yaml values-secret.yaml
#   然后把下面的 <PLACEHOLDER:...> 逐个替换为 .env 里的真实值，
#   或用 scripts/gen_values_secret.py 从 .env 自动生成本文件对应的 values-secret.yaml。
#   ⚠️ 不要在注释里写「键=<真实值>」形式——仓库脱敏门禁会拦。
# =============================================================================

secret:
  data:
    POSTGRES_PASSWORD: "<PLACEHOLDER:set-from-.env>"
    LLM_PRIMARY_API_KEY: "<PLACEHOLDER:set-from-.env>"
    LITELLM_MASTER_KEY: "<PLACEHOLDER:set-from-.env>"

# 必填键清单：列在这里的键若最终值为空，helm install 直接报错。
# 由 values-prod.yaml 设置；此处不需要覆盖（-f 多文件是 map 合并，
# 但**列表会整体替换**，若在此处写 requiredKeys 会覆盖掉 prod 的清单）。
# requiredKeys:
#   - POSTGRES_PASSWORD
