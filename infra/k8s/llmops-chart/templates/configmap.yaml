{{- if .Values.configMap.enabled -}}
{{/*
ConfigMap · 非敏感配置
来源：W1 的 infra/k8s/config.yaml（ConfigMap 部分）
值来自 values.yaml 的 configMap.data，可被 values-dev/prod.yaml 覆盖
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llmops-chart.configMapName" . }}
  labels:
    {{- include "llmops-chart.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
