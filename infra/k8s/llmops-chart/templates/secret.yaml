{{- if .Values.secret.enabled -}}
{{/*
Secret · 敏感信息
来源：W1 的 infra/k8s/config.yaml（Secret 部分）
⚠️ 真值**不在仓库里** —— 通过 -f values-secret.yaml 注入（该文件已被 .gitignore 挡住）

用 stringData 而非 data：stringData 接受明文，由 apiserver 自动转 base64 存入 data。
（注意 Secret 只是 base64，不是加密 —— 别把真值提交到 Git。）

安全闸门：secret.requiredKeys 列出"必须非空"的键。仅当某键在清单里且值为空时才 fail。
→ 比"全局开关"更贴近生产：真实环境里 Secret 中总有一些键（如本地演练用的上游 key）允许为空。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmops-chart.secretName" . }}
  labels:
    {{- include "llmops-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $required := .Values.secret.requiredKeys | default (list) }}
  {{- range $k, $v := .Values.secret.data }}
  {{- if and (not $v) (has $k $required) }}
  {{- fail (printf "secret.data.%s 是必填项但值为空：请用 -f values-secret.yaml 注入真值，或从 secret.requiredKeys 里移除它" $k) }}
  {{- end }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
