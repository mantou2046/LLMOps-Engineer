# =============================================================================
# values-prod.yaml · 生产（模拟）环境覆盖值
# -----------------------------------------------------------------------------
# 用法：
#   helm install llmops-prod ./llmops-chart -n prod --create-namespace -f values-prod.yaml
#
# ⚠️ 与 dev 的关键差异（也是"双环境"要演示的对比点）：
#      replicaCount  1 → 2
#      LOG_LEVEL     DEBUG → INFO
#      资源 limits   宽松 → 收紧（贴近真实配额）
#      Secret        requiredKeys 为空 → [POSTGRES_PASSWORD]（生产必须有真凭据）
# =============================================================================

# prod 2 个副本：能演示"删一个 Pod 看自愈"
# ⚠️ 下方开了 HPA 后此值对 Deployment 失效（副本数由 HPA 接管，起点 = minReplicas）；
#    保留它作为「关掉 HPA 就能回退」的基准。
replicaCount: 2

image:
  repository: llmops-api
  pullPolicy: IfNotPresent
  tag: "0.5.0"

# 资源收紧：贴近生产配额
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

# ⚠️ 列表整体替换：全部写全
env:
  - name: APP_VERSION
    value: "0.5.0"
  - name: STARTUP_DELAY_SECONDS
    value: "0"
  # prod **显式关闭** /work 压测端点 —— 这类"帮忙烧 CPU"的端点在真生产里
  # 就是现成的 DoS 放大器。dev 开、prod 关，正是"同一模板 + 不同 values"的用武之地。
  - name: ENABLE_LOAD_ENDPOINT
    value: "0"
  # W2 D8 · prod 切真实上游（需在 values-secret.yaml 里补 LLM_PRIMARY_API_KEY /
  #   LLM_PRIMARY_MODEL / LLM_PRIMARY_BASE_URL）。mock 只属于本地演练。
  - name: LLM_MODE
    value: "openai"
  # prod 重试更稳：4 次尝试、退避封顶 10s（外网上游抖动更常见）
  - name: LLM_MAX_ATTEMPTS
    value: "4"
  - name: LLM_BACKOFF_MIN
    value: "1"
  - name: LLM_BACKOFF_MAX
    value: "10"
  - name: LLM_TIMEOUT_SECONDS
    value: "60"
  # prod 不做故障注入
  - name: MOCK_FAIL_N_TIMES
    value: "0"
  # W2 D9 · prod 真的上报 Langfuse（需要 Secret 里的两把 key，见下方 requiredKeys）。
  - name: OBSERVABILITY
    value: "langfuse"

# ConfigMap：prod 用 INFO 日志
configMap:
  enabled: true
  data:
    APP_ENV: "prod"
    LOG_LEVEL: "INFO"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "llmops"
    POSTGRES_USER: "llmops"
    LITELLM_BASE_URL: "http://litellm:4000"
    LITELLM_CACHE_ENABLED: "true"
    LANGFUSE_HOST: "http://localhost:3000"
    # ⚠️ prod 采样率先留 1.0（全量）便于演示；D11 压测时必须调低 ——
    #    trace 落盘量会随 QPS 线性增长，是全链路里最容易把磁盘吃满的一环。
    LANGFUSE_SAMPLE_RATE: "1.0"

# Secret：生产强制要求真凭据（装的时候必须 -f values-secret.yaml）
# ⚠️ 只列"必须非空"的键 —— LLM_PRIMARY_API_KEY / LITELLM_MASTER_KEY 在本地演练里
#    本来就走内网 LiteLLM，不需要真上游 key，所以不列入必填。
#    W2 D9：prod 开了 OBSERVABILITY=langfuse，两把 key 就成了真必填 ——
#    缺了虽然不会让 Pod 起不来（观测失败仅降级），但面板上会一条 trace 都没有。
secret:
  enabled: true
  requiredKeys:
    - POSTGRES_PASSWORD
    - LANGFUSE_PUBLIC_KEY
    - LANGFUSE_SECRET_KEY

# 探针：prod 收紧，尽快发现问题
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 3
  failureThreshold: 2
  successThreshold: 1
  timeoutSeconds: 1

# ingress：prod 用正式 host
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: llmops.local
      paths:
        - path: /
          pathType: Prefix

# HPA：prod 也开，但参数与 dev **刻意不同** —— 这正是"同一套模板 + 不同 values
#       = 不同环境行为"的落点。
#   · 起点更高（min 2）：生产不允许掉到单副本
#   · 上限更保守（max 6）：本地 kind 单节点，扩太多只是互相抢 CPU
#   · 目标更松（60%）：给突发流量留缓冲，避免副本数来回抖
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
