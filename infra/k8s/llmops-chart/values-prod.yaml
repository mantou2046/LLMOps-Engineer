# =============================================================================
# values-prod.yaml · 生产（模拟）环境覆盖值
# -----------------------------------------------------------------------------
# 用法：
#   helm install llmops-prod ./llmops-chart -n prod --create-namespace -f values-prod.yaml
#
# ⚠️ 与 dev 的关键差异（也是"双环境"要演示的对比点）：
#      replicaCount  1 → 2
#      LOG_LEVEL     DEBUG → INFO
#      资源 limits   宽松 → 收紧（贴近真实配额）
#      Secret        requiredKeys 为空 → [POSTGRES_PASSWORD]（生产必须有真凭据）
# =============================================================================

# prod 2 个副本：能演示"删一个 Pod 看自愈"
# ⚠️ 下方开了 HPA 后此值对 Deployment 失效（副本数由 HPA 接管，起点 = minReplicas）；
#    保留它作为「关掉 HPA 就能回退」的基准。
replicaCount: 2

image:
  repository: llmops-api
  pullPolicy: IfNotPresent
  tag: "0.3.0"

# 资源收紧：贴近生产配额
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

# ⚠️ 列表整体替换：三项都要写全
env:
  - name: APP_VERSION
    value: "0.3.0"
  - name: STARTUP_DELAY_SECONDS
    value: "0"
  # prod **显式关闭** /work 压测端点 —— 这类"帮忙烧 CPU"的端点在真生产里
  # 就是现成的 DoS 放大器。dev 开、prod 关，正是"同一模板 + 不同 values"的用武之地。
  - name: ENABLE_LOAD_ENDPOINT
    value: "0"

# ConfigMap：prod 用 INFO 日志
configMap:
  enabled: true
  data:
    APP_ENV: "prod"
    LOG_LEVEL: "INFO"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "llmops"
    POSTGRES_USER: "llmops"
    LITELLM_BASE_URL: "http://litellm:4000"
    LITELLM_CACHE_ENABLED: "true"

# Secret：生产强制要求真凭据（装的时候必须 -f values-secret.yaml）
# ⚠️ 只列"必须非空"的键 —— LLM_PRIMARY_API_KEY / LITELLM_MASTER_KEY 在本地演练里
#    本来就走内网 LiteLLM，不需要真上游 key，所以不列入必填。
secret:
  enabled: true
  requiredKeys:
    - POSTGRES_PASSWORD

# 探针：prod 收紧，尽快发现问题
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 3
  failureThreshold: 2
  successThreshold: 1
  timeoutSeconds: 1

# ingress：prod 用正式 host
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: llmops.local
      paths:
        - path: /
          pathType: Prefix

# HPA：prod 也开，但参数与 dev **刻意不同** —— 这正是"同一套模板 + 不同 values
#       = 不同环境行为"的落点。
#   · 起点更高（min 2）：生产不允许掉到单副本
#   · 上限更保守（max 6）：本地 kind 单节点，扩太多只是互相抢 CPU
#   · 目标更松（60%）：给突发流量留缓冲，避免副本数来回抖
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
