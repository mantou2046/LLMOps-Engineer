{{- if not .Values.db.password -}}
{{- fail "db.password 为空：请用 -f values-secret.yaml 注入（该文件已在 .gitignore 里）" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Secret 只是 base64，不是加密 —— 真值不进 Git
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
