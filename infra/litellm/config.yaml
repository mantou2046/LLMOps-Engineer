# =============================================================================
# LiteLLM 网关配置 —— W4 D5
# -----------------------------------------------------------------------------
# 起法（仓库根）：
#   D:\python314\Scripts\litellm.exe --config infra/litellm/config.yaml --port 4001
#
# ⚠️ 端口用 4001 不用 4000：本机 4000 被「AMD 免费模型可用度监控」占着。
#
# ⚠️ 本文件含中文注释（UTF-8）。LiteLLM 读它时用 `open()` 不指定 encoding，
#    中文 Windows 下默认 cp936 → 会崩 `UnicodeDecodeError: 'gbk' codec can't decode`。
#    起之前必须 `$env:PYTHONUTF8 = "1"`（`scripts/load_env.ps1` 已替你设好）。
#
# 五块顶层：model_list / router_settings / litellm_settings / general_settings
#            （第五块 environment_variables 这里不用，密钥统一走 .env）
# =============================================================================

model_list:
  # ① 主模型：复杂问题走这条（应用侧看到的别名就是 primary）
  #
  #    ⚠️ 2026-10-28 12:58 改动：`deepseek-v4-flash` 被免费池 **429**
  #    （"All models exhausted"，实测每条 primary 都先失败再 fallback 到 backup，
  #     三轮探针一次缓存都没命中，token 数变成 144/153/219 那一串备用模型指纹）。
  #    → 换成 `qwen3.5-397b`（实测 200 / 2.75s）。
  #    ✅ 2026-10-28 13:41 定案：**不再改回**。理由：原目标在免费池里不可靠，
  #       而「换哪个模型」本来就是网关这层的事——真换了只改这一行，应用代码零改动。
  - model_name: primary
    litellm_params:
      model: openai/qwen3.5-397b
      api_base: os.environ/LLM_PRIMARY_BASE_URL
      api_key: os.environ/LLM_PRIMARY_API_KEY
      rpm: 60

  # ② 便宜模型：简单问题分流（同一个上游，换一个更轻的 model id）
  #
  #    ⚠️ 2026-10-28（W4 D6）改过两次目标：
  #      1) 原先 deepseek-v4-flash-0731，上游 `/v1/models` 标成
  #         `available: false, unavailable_reason: "no_key"` → 每个 cheap 请求
  #         先失败再 fallback（2~3s，且 model-group 永远是 backup）；
  #      2) 换成 gemini-3.5-flash-lite 后又被免费池 429，整轮掉 backup。
  #    → 现在指向 `gemini-flash-lite`（实测 200 / 1.54s）。
  #    ✅ 2026-10-28 13:41 定案：**不再改回**。这与 primary 是两个不同型号，
  #       保持「贵档跑 qwen3.5-397b / 便宜档跑 gemini-flash-lite」的分层。
  #    **这正是网关的价值**：换目标只改这一行，应用代码一行不动。
  #    判据：改前先跑 `curl .../v1/models` 看 available，别信别名配了就一定通。
  - model_name: cheap
    litellm_params:
      model: openai/gemini-flash-lite
      api_base: os.environ/LLM_PRIMARY_BASE_URL
      api_key: os.environ/LLM_PRIMARY_API_KEY
      rpm: 60

  # ③ 备用模型：primary 重试耗尽后自动切过来（fallbacks 的目标）
  #    用上游的 auto 槽位 —— 它自己会挑一个当前可用的模型，
  #    等于「连备用也是个会挑的」，故障域比写死一个 model id 更宽。
  #
  #    ⚠️ api_base 故意用**独立变量** LLM_BACKUP_BASE_URL，不复用 primary 的。
  #    否则演示「primary 挂了」时只要把 LLM_PRIMARY_BASE_URL 改坏，
  #    backup 会跟着一起坏 —— fallback 就永远不可能成功。
  #    生产上这两条本来就该是不同厂商，独立变量也是对的。
  - model_name: backup
    litellm_params:
      model: openai/auto
      api_base: os.environ/LLM_BACKUP_BASE_URL
      api_key: os.environ/LLM_BACKUP_API_KEY
      rpm: 60

  # ---------------------------------------------------------------------------
  # ④⑤ 本地假上游两档（W5 D3 加）—— 专门用来量 LLM 指标，不是业务模型
  # ---------------------------------------------------------------------------
  # 为什么要有这两个：D3 要验证「TTFT / 成本 / 缓存命中」这些指标的口径对不对，
  # 而验证的前提是**真值已知**。真实上游首包时长不可控、还可能被免费池 429
  # （W4 D5 实测 429 会伪装成缓存失效 / fallback / token 数异常），
  # 拿它当基准等于用一把会伸缩的尺子量长度。
  # 所以指向 scripts/fake_upstream.py：首包固定 300ms、token 数写死 100/50。
  #
  # 两档**故意价差 10 倍**：这样「今天成本为什么涨了」有个确定答案 ——
  # 请求从便宜档挪到贵档，单价差一个数量级，在面板上能一眼看出来。
  #
  # ⚠️ 这两条**不参与业务路由**（应用侧 primary/cheap 仍指真实上游），
  #    只在 D3 手册里直接用 curl 打。上线前删掉这两条即可。
  #
  # ⚠️ `model_info` 里的定价是**必须写的**，不是可选美化：
  #    `openai/fake-model` 不在 LiteLLM 的定价表里（内置表只认 gpt-4o 这类），
  #    不写 → `litellm_spend_metric` 恒为 0 → 成本面板显示「每请求 $0」，
  #    看着像「很省钱」，实际是「压根没算」。这个坑见 D3 手册步骤 8。
  - model_name: local-cheap
    litellm_params:
      model: openai/fake-model
      api_base: os.environ/FAKE_UPSTREAM_BASE_URL
      api_key: fake-no-key-needed
    model_info:
      input_cost_per_token: 0.0000001    # $0.1 / 百万 input token
      output_cost_per_token: 0.0000002   # $0.2 / 百万 output token

  - model_name: local-primary
    litellm_params:
      model: openai/fake-model
      api_base: os.environ/FAKE_UPSTREAM_BASE_URL
      api_key: fake-no-key-needed
    model_info:
      input_cost_per_token: 0.000001     # 贵 10 倍
      output_cost_per_token: 0.000002

  # ⑥ 故意打不通的档位（W5 D3 加）—— 唯一用途：造**确定的**错误率
  # 端口 4011 上什么都不跑，所以每次调用必然连接失败 → 网关重试后仍失败 → 客户端拿到 5xx。
  # 为什么不用「让假上游按概率返回 500」：概率造出来的错误率每次都不一样，
  # 手册里就写不出确定数字，也没法对着面板验算。
  - model_name: local-dead
    litellm_params:
      model: openai/fake-model
      api_base: http://127.0.0.1:4011/v1
      api_key: fake-no-key-needed

router_settings:
  routing_strategy: simple-shuffle   # 同一 model_name 多部署时的挑法；单部署时无感
  num_retries: 1                     # 同一部署内先重试 1 次，仍失败才走 fallbacks
  timeout: 120                       # 上游首包慢（冷启动 20~30s），别设太紧
  allowed_fails: 3                   # 连续失败几次进入 cooldown
  cooldown_time: 30                  # cooldown 期间跳过这个部署

litellm_settings:
  # ---- 可观测性：把网关自己的指标暴露到 /metrics（W5 D3 加）----
  # 为什么是网关这层量 TTFT：应用层只量到「响应头就绪」（W5 D1 实测流式请求
  # 客户端 1.641s、应用直方图只记 0.424s），而 TTFT 是「第一个 token 到达」，
  # 只有真正跟上游对话的这一层才知道。网关就在那个位置上。
  #
  # ⚠️ 这个开关是「挂 /metrics 端点」的唯一开关，不是可选美化：
  #    LiteLLM 1.106.4 的实现在 proxy_server.py 里监听 success_callback，
  #    只有回调名里含 "prometheus" 才调 PrometheusLogger._mount_metrics_endpoint()。
  #    不开 → 网关 4001/metrics 直接 404，Prometheus 那条 job 永远 DOWN。
  # ⚠️ 端点与网关**同端口**（4001），不是另开一个端口。
  callbacks: ["prometheus"]

  # ---- 指标端点的鉴权：默认开，本机关掉（W5 D3 实测）----
  # 1.106.4 的默认值是**开鉴权**（PrometheusAuthMiddleware，安全默认，对的）。
  # 但那条鉴权路径走的是 `user_api_key_auth` → 需要 prisma 连 DB；
  # 我们没跑 DB 代理模式（网关只读 yaml）→ 实测报：
  #     "Unauthorized access to metrics endpoint: No module named 'prisma'"
  # 这句话会把人引向「去装 prisma」，而真正该做的是选一条鉴权方案。
  #
  # 本机选「关掉 + 只监听回环」：
  #   · compose/启动命令里网关只绑 127.0.0.1:4001，同网段访问不到；
  #   · 指标里含**每请求成本**和用量，属于要保密的东西 —— 所以这条关掉
  #     的代价必须靠「只听回环」兜住，**绝不能改成 0.0.0.0**。
  #
  # 生产该怎么做（二选一，别照抄本机配置）：
  #   a) 保留鉴权，给 Prometheus 配 bearer token 文件：
  #        scrape_configs[].authorization: { type: Bearer, credentials_file: /etc/prom/token }
  #   b) 网关前面挂反向代理，把 /metrics 只对内网放行，并关掉本开关。
  require_auth_for_metrics_endpoint: false

  # ---- 故障转移：先 retry，后 fallback ----
  fallbacks:
    - primary: ["backup"]
    - cheap: ["backup"]

  # ---- 缓存（第 1 层：精确匹配）----
  # key = 整请求哈希 → 只要 messages / temperature / max_tokens 任一不同就 miss
  cache: true
  cache_params:
    type: redis
    host: 127.0.0.1
    port: 6381          # 就是 llmops-redis 容器的映射端口（不是 6379）
    ttl: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
