  <rect width="680" height="1320" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">LLMOps 作品集 · 架构图 v4.1 · 定稿</text>
  <text x="24" y="56" font-size="12" fill="#475569">《资金 / 财务制度知识库 · 智能问答与评估平台》　W8 D1 收口（2026-11-11）</text>
  <text x="24" y="74" font-size="12" fill="#475569">C4 只画前两层：L1 上下文（跟谁打交道）＋ L2 容器（可独立部署的部分）——十二层明细见 v3 图</text>

