  <!-- ============ 决策标注 ============ -->
  <rect x="24" y="1204" width="632" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="1228" font-size="11.5" font-weight="700" fill="#334155">图上 8 个决策标注（一句话版）· 完整证据与复核条件见 docs/DECISION_INDEX.md</text>
  <text x="36" y="1252" font-size="9.5" fill="#334155">① 入口 · ingress-nginx 而非 NodePort：kind 宿主机访问不到 NodePort；三条 Host 各 200（DEC-011）</text>
  <text x="36" y="1280" font-size="9.5" fill="#334155">② 打包 · Helm 而非裸 YAML：Release 带 revision，回滚一条命令（DEC-015）</text>
  <text x="36" y="1308" font-size="9.5" fill="#334155">② 检索 · 递归切块 400/50 + RRF 融合：hit@1 7/10 → 10/10、MRR 0.825 → 1.0（DEC-039/040）</text>
  <text x="36" y="1336" font-size="9.5" fill="#334155">② 分流 · 规则判档而非 LLM 判路由：4.8–6.0 µs vs 0.5–2 s；离线 12/12 与标注一致（DEC-033）</text>
  <text x="36" y="1364" font-size="9.5" fill="#334155">② 护栏 · 格式错最多修一次 + 固定兜底：30 条误拦 0 / 漏拦 0（DEC-049）</text>
  <text x="36" y="1392" font-size="9.5" fill="#334155">③ 出口 · 三档别名 + 精确缓存，语义缓存暂缓：1161.6 → 8.9 ms、响应 id 相同（DEC-032/050）</text>
