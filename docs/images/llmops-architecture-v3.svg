  <text x="456" y="887" font-size="10.5" fill="#64748b">从版本反查请求（唯一入口）</text>

  <line x1="340" y1="912" x2="340" y2="928" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="340,930 335,920 345,920" fill="#94a3b8"/>

  <!-- ⑨ 版本与发布（W3） -->
  <rect x="24" y="930" width="632" height="112" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="36" y="950" font-size="12" font-weight="700" fill="#4338ca">⑨ 版本与发布（W3，D27：内容归 git、指向归 registry）</text>
