<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1420" width="680" height="1420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="1420" fill="#ffffff"/>

