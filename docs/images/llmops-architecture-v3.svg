  <text x="206" y="763" font-size="10.5" fill="#64748b">ns 内直连</text>
  <rect x="352" y="730" width="150" height="46" rx="7" fill="#ffffff" stroke="#22d3ee" stroke-width="1.1"/>
  <text x="364" y="748" font-size="11" font-weight="600" fill="#155e75">PVC /mlartifacts</text>
  <text x="364" y="763" font-size="10.5" fill="#64748b">2Gi · 代理模式</text>
  <rect x="510" y="730" width="146" height="46" rx="7" fill="#ffffff" stroke="#22d3ee" stroke-width="1.1"/>
