  <text x="48" y="976" font-size="11" font-weight="600" fill="#3730a3">git prompts/*.yaml</text>
  <text x="48" y="991" font-size="10.5" fill="#64748b">sha256[:8] 真源</text>
  <rect x="184" y="958" width="130" height="46" rx="7" fill="#ffffff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="196" y="976" font-size="11" font-weight="600" fill="#3730a3">CI 校验 hash</text>
  <text x="196" y="991" font-size="10.5" fill="#64748b">两端比对</text>
  <rect x="322" y="958" width="150" height="46" rx="7" fill="#ffffff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="334" y="976" font-size="11" font-weight="600" fill="#3730a3">registry label</text>
  <text x="334" y="991" font-size="10.5" fill="#64748b">production / canary</text>
  <rect x="480" y="958" width="176" height="46" rx="7" fill="#ffffff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="492" y="976" font-size="11" font-weight="600" fill="#3730a3">服务解析 + 60s 缓存</text>
  <text x="492" y="991" font-size="10.5" fill="#64748b">回落本地 + local_pick</text>
  <text x="36" y="1022" font-size="10.5" fill="#15803d">实测：v1↔v2 拨 label 零发版零重启；两 run 血缘四项对齐（prompt / model / max_tokens / git sha）</text>
  <text x="36" y="1036" font-size="10.5" fill="#b45309">边界：原生关联 ≠ 可筛——Tracing 的 promptVersion 维度不可筛，只能从 Prompt 侧反查</text>

  <line x1="340" y1="1042" x2="340" y2="1058" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="340,1060 335,1050 345,1050" fill="#94a3b8"/>

  <!-- ⑩ 编排调度（W4 新增） -->
  <rect x="24" y="1060" width="632" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="1080" font-size="12" font-weight="700" fill="#b45309">⑩ 编排调度 · Prefect（W4 新增，D29：只给 RAG 索引重建上编排器）</text>
  <rect x="36" y="1088" width="146" height="46" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="48" y="1106" font-size="11" font-weight="600" fill="#92400e">flow · 4 task</text>
  <text x="48" y="1121" font-size="10.5" fill="#64748b">scan→chunk→embed→upsert</text>
  <rect x="190" y="1088" width="146" height="46" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="202" y="1106" font-size="11" font-weight="600" fill="#92400e">.serve(cron)</text>
  <text x="202" y="1121" font-size="10.5" fill="#64748b">定时 + 手动触发</text>
  <rect x="344" y="1088" width="146" height="46" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="356" y="1106" font-size="11" font-weight="600" fill="#92400e">增量跳过</text>
  <text x="356" y="1121" font-size="10.5" fill="#64748b">按 chunk_sha</text>
  <rect x="498" y="1088" width="158" height="46" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="510" y="1106" font-size="11" font-weight="600" fill="#92400e">退避重试</text>
  <text x="510" y="1121" font-size="10.5" fill="#64748b">[1,3] / 指数</text>
  <text x="36" y="1150" font-size="10.5" fill="#15803d">实测：flow 79.51s（train 78.19s 占 98.3%）· 失败 3 次尝试定位到步 · pgvector 0.8.7 IVFFlat</text>

  <line x1="340" y1="1166" x2="340" y2="1182" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="340,1184 335,1174 345,1174" fill="#94a3b8"/>

  <!-- ⑪ 模型网关（W4 新增） -->
  <rect x="24" y="1184" width="632" height="112" rx="10" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="36" y="1204" font-size="12" font-weight="700" fill="#0e7490">⑪ 模型网关 · LiteLLM（W4 新增，D32：三别名 + fallback 链 + 精确缓存）</text>
  <rect x="36" y="1212" width="146" height="46" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.1"/>
  <text x="48" y="1230" font-size="11" font-weight="600" fill="#155e75">primary / cheap</text>
  <text x="48" y="1245" font-size="10.5" fill="#64748b">+ backup 三档别名</text>
  <rect x="190" y="1212" width="146" height="46" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.1"/>
  <text x="202" y="1230" font-size="11" font-weight="600" fill="#155e75">fallback 链</text>
  <text x="202" y="1245" font-size="10.5" fill="#64748b">primary→backup</text>
  <rect x="344" y="1212" width="146" height="46" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.1"/>
  <text x="356" y="1230" font-size="11" font-weight="600" fill="#155e75">精确缓存 redis</text>
  <text x="356" y="1245" font-size="10.5" fill="#64748b">TTL 600 · 语义暂缓</text>
  <rect x="498" y="1212" width="158" height="46" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.1"/>
  <text x="510" y="1230" font-size="11" font-weight="600" fill="#155e75">重试只留一层</text>
  <text x="510" y="1245" font-size="10.5" fill="#64748b">应用 attempts=1</text>
  <text x="36" y="1274" font-size="10.5" fill="#15803d">实测：主模型指死端口仍 200（attempted-fallbacks:1 · model-group:backup）；去 fallback 同请求 5xx</text>
  <text x="36" y="1288" font-size="10.5" fill="#b45309">坑：别名背后模型 no_key → 静默降级；连网关写 127.0.0.1（localhost 走 ::1 每次多等 2s）</text>

  <line x1="340" y1="1296" x2="340" y2="1312" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="340,1314 335,1304 345,1304" fill="#94a3b8"/>

