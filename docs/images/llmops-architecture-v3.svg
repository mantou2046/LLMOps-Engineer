  <text x="24" y="72" font-size="12" fill="#475569">从「能解释为什么变好/变差」到「能解释每次请求走了哪条路、花了多少」—— 新增 ⑩ 编排调度 / ⑪ 模型网关 / ⑫ 分流与缓存</text>

