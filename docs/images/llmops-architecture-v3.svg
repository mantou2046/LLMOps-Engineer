  <text x="36" y="466" font-size="10.5" fill="#b45309">注意 D10　清单只放占位符；mlflow 的 values-secret.yaml 由脚本从 default/llmops-secrets 生成</text>

  <line x1="340" y1="474" x2="340" y2="490" stroke="#94a3b8" stroke-width="1.6"/>
