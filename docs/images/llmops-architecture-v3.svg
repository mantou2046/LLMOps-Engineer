  <rect x="36" y="520" width="196" height="44" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="48" y="538" font-size="11" font-weight="600" fill="#92400e">postgres-0</text>
  <text x="48" y="553" font-size="10.5" fill="#64748b">Postgres 16 + pgvector</text>
  <rect x="240" y="520" width="180" height="44" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="252" y="538" font-size="11" font-weight="600" fill="#92400e">headless Service</text>
  <text x="252" y="553" font-size="10.5" fill="#64748b">postgres · 5432</text>
  <rect x="428" y="520" width="228" height="44" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="440" y="538" font-size="11" font-weight="600" fill="#92400e">PVC data-postgres-0</text>
  <text x="440" y="553" font-size="10.5" fill="#64748b">1Gi · RWO · Bound</text>
  <text x="36" y="580" font-size="10.5" fill="#15803d">库：llmops（应用）＋ mlflow（W3 新增，alembic 自动建表）　｜　删 Pod 重建后数据不丢</text>

  <line x1="340" y1="596" x2="340" y2="612" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="340,614 335,604 345,604" fill="#94a3b8"/>

  <!-- ⑥ 运行基座 -->
  <rect x="24" y="614" width="632" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
