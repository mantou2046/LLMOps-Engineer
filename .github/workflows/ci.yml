name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------- 1) 脱敏检查（W1 起，原 job 保留） ----------
  sensitive-check:
    name: 脱敏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描全树
        run: python scripts/check_sensitive.py --all

  # ---------- 2) lint（W5 D5 加）：ruff 检查 ----------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 dev 依赖（含 ruff）
        run: pip install -r requirements-dev.txt
      - name: ruff check（与本地钩子同一条命令）
        run: ruff check tests/
      # 和 .githooks/pre-commit 里的 ruff 一致，只 check 不 --fix

  # ---------- 3) test（W5 D5 加）：pytest，全 mock，无 API Key ----------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 dev 依赖（含 pytest/httpx）
        run: pip install -r requirements-dev.txt
      - name: 装运行依赖（tests 会 import app/ 的模块）
        run: pip install -r requirements.txt
      - name: pytest（走 LLM_MODE=mock，不碰真实 API）
        run: pytest
      # pyproject.toml 的 testpaths=["tests"] 会把范围锁死在 tests/

  # ---------- 4) eval 门禁（W6 D6 加）：非 LLM，抽样子集 ----------
  eval-gate:
    name: eval 门禁（非 LLM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 零第三方依赖：切块、BM25、块号判命中全用标准库。
      # --self-test 同时验证「正常放行」和「改坏 prompt 被拦下」两个方向。
      - name: 数据完整性 + 检索回归 + 反例
        run: python scripts/w6d6_eval_gate.py --self-test

  # ---------- 5) build（W5 D5 加）：验证镜像能构建 ----------
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（用 app/Dockerfile，上下文=仓库根）
        run: docker build -f app/Dockerfile -t llmops-api:ci-${{ github.sha }} .